doc-valid-idents = ["CartPole", "PettingZoo", "PufferLib", "..", "EnvPool"]


# Test code may unwrap, expect, panic and index directly.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# ADR-0008: non-portable float methods are banned in simulation code.
# Transcendental math comes from `tessera_rl_num::math`.
disallowed-methods = [
    { path = "f32::mul_add", reason = "ADR-0008: FMA is not bit-portable" },
    { path = "f64::mul_add", reason = "ADR-0008: FMA is not bit-portable" },
    { path = "f32::powi", reason = "ADR-0008: use tessera_rl_num::math" },
    { path = "f64::powi", reason = "ADR-0008: use tessera_rl_num::math" },
    { path = "f32::powf", reason = "ADR-0008: use tessera_rl_num::math" },
