[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "tessera-rl-test-host-wheel"
version = "0.0.0"
requires-python = ">=3.11"

[tool.maturin]
module-name = "_tessera_host"

# Host protocol 1 discovery (SPEC 14.4.1): tessera_rl.make finds the test
# counter through this entry point (make py-test-host).
[project.entry-points."tessera_rl.envs"]
"test/FactoryCounter-v1" = "_tessera_host:make"
# The spawning environment of the ADR-0013 respawn test (#71).
"test/Respawn-v1" = "_tessera_host:make_respawn"
# The two-head masked environment of the multi-head AEC test (#311).
"test/MultiHead-v1" = "_tessera_host:make_multihead"
