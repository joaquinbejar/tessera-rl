#
# Every versioned format, its committed fixture files and the tests that
# read them back, pin the writer and refuse a newer or another-major
# version (#641). tests/python/test_format_fixture_index.py checks that each
# fixture exists and is not empty, that each test is defined in its file,
# and that each version constant still has the version listed here.

[[format]]
name = "persisted record"
version = 1
constant = { file = "crates/tessera-rl-engine/src/persist.rs", text = "pub const FORMAT_VERSION: u32 = 1;" }
fixtures = ["crates/tessera-rl-classic/tests/golden/persist-cartpole.bin"]
tests = { file = "crates/tessera-rl-classic/tests/format_persist_versions.rs", names = [
    "test_format_persist_fixtures_have_versions_1_and_2",
    "test_format_persist_newer_and_other_major_versions_are_refused",
] }

