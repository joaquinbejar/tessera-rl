# A Tessera environment crate on the `Environment` trait (SPEC 10),
# scaffolded by `cargo tessera new --kind env`. Its own package and
# workspace, Rust only: no Python package (ADR-0032).

[package]
name = "study-ref-a"
description = "A Tessera environment: study-ref-a/StudyRefA-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Read by `cargo tessera check`.
[package.metadata.tessera]
kind = "env"

[lib]
name = "study_ref_a"

# The Tessera crates of a local checkout, by path.
[dependencies]
tessera-rl-core = { path = '../../../../crates/tessera-rl-core' }
tessera-rl-macros = { path = '../../../../crates/tessera-rl-macros' }
tessera-rl-num = { path = '../../../../crates/tessera-rl-num' }

[dev-dependencies]
# EnvPool: the checks and the bench.
tessera-rl-engine = { path = '../../../../crates/tessera-rl-engine' }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[test]]
name = "check"

[[bench]]
name = "step"
harness = false

# Not part of any other workspace.
[workspace]

# The Tessera workspace's lints, so `cargo clippy -- -D warnings` holds this
# crate to the same rules (with clippy.toml, ADR-0008).
[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
