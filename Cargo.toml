# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "3"
members = [
    "crates/tessera-rl",
    "crates/tessera-rl-core",
    "crates/tessera-rl-num",
    "crates/tessera-rl-simd",
    "crates/tessera-rl-macros",
    "crates/tessera-rl-engine",
    "crates/tessera-rl-classic",
    "crates/tessera-rl-games",
    "crates/tessera-rl-search",
    "crates/tessera-rl-rts",
    "crates/tessera-rl-onnx",
    "tools/math-oracle",
    "tools/bench-runner",
    "tools/connect4-ref",
    "tools/spikes/layout",
    "tests/downstream",
    "crates/tessera-rl-py",
]
# The fuzz targets build with nightly and cargo-fuzz, outside the workspace.
exclude = ["fuzz"]
default-members = [
    "crates/tessera-rl",
    "crates/tessera-rl-core",
    "crates/tessera-rl-num",
    "crates/tessera-rl-simd",
    "crates/tessera-rl-macros",
    "crates/tessera-rl-engine",
    "crates/tessera-rl-classic",
    "crates/tessera-rl-games",
    "crates/tessera-rl-search",
    "crates/tessera-rl-rts",
    "crates/tessera-rl-onnx",
    "tests/downstream",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Joaquín Béjar <jb@taunais.com>"]
repository = "https://github.com/joaquinbejar/tessera-rl"
homepage = "https://github.com/joaquinbejar/tessera-rl"
keywords = ["reinforcement", "gymnasium", "simulation", "multi-agent"]
categories = ["science", "simulation"]

[workspace.dependencies]
tessera-rl = { path = "crates/tessera-rl", version = "0.1.0" }
tessera-rl-core = { path = "crates/tessera-rl-core", version = "0.1.0" }
tessera-rl-num = { path = "crates/tessera-rl-num", version = "0.1.0" }
tessera-rl-simd = { path = "crates/tessera-rl-simd", version = "0.1.0" }
tessera-rl-macros = { path = "crates/tessera-rl-macros", version = "0.1.0" }
tessera-rl-engine = { path = "crates/tessera-rl-engine", version = "0.1.0" }
tessera-rl-classic = { path = "crates/tessera-rl-classic", version = "0.1.0" }
tessera-rl-games = { path = "crates/tessera-rl-games", version = "0.1.0" }
tessera-rl-search = { path = "crates/tessera-rl-search", version = "0.1.0" }
tessera-rl-onnx = { path = "crates/tessera-rl-onnx", version = "0.1.0" }
tessera-rl-rts = { path = "crates/tessera-rl-rts", version = "0.1.0" }

core_affinity = "0.8"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Instruction-count gate (ADR-0025); dev-only, pinned: the library must
# match the gungraun-runner binary 0.20.0.
gungraun = "=0.20.0"
# Environment registration records (ADR-0032, ADR-0054).
inventory = "0.3"
proptest = { version = "1", default-features = false, features = ["std"] }
# Only in tessera-rl-py, without the macros (ADR-0041: every entry is
# registered through the thunk table).
pyo3 = { version = "0.30", default-features = false, features = ["abi3-py311", "extension-module"] }
libc = "0.2"
# The ONNX evaluator (ADR-0057): `ort` pinned exactly (owner decision
# 2026-11-12), dynamic loading only, no binaries downloaded at build time.
# `libloading` is the version `ort` itself resolves; it is used directly
# only by the audited `onnx::sys` version read.
libloading = "0.9"
# api-31: the C API level of the pinned ONNX Runtime 1.31.1 (the loader's
# exact version check guarantees it); needed for explicit device selection.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "api-31"] }
# Content identity of the runtime library and the model (ADR-0057 section 3).
sha2 = { version = "0.10", default-features = false }
loom = "0.7"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
trybuild = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
missing_docs = "deny"
# `deny`, not `forbid`: the audited modules (engine::buffer, engine::sys,
# py::ffi, simd, core::encoding, num::fp, onnx::sys) opt in with
# `#[expect(unsafe_code, reason = "...")]`; every other module stays denied.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Release wheels (docs/reviews/pgo-wheels-design.md). `release` itself, which
# the tests and the wall-clock benches use, does not change.
[profile.wheel]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "unwind"

# The instruction-count gate (ADR-0059): one codegen unit, so a bench's
# instruction count does not depend on how unrelated code partitions its
# crate. No LTO. scripts/gungraun.sh builds the gate's benches with it and
# checks the rustc flags; Criterion's wall-clock benches keep `bench`.
[profile.bench-gate]
inherits = "bench"
codegen-units = 1
