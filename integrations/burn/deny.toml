# SPDX-License-Identifier: MIT OR Apache-2.0
#
# cargo-deny policy of the Burn integration workspace (#367): the root
# deny.toml plus one licence exception. Keep the rest in step with the root.

# cargo-deny policy: licenses compatible with MIT OR Apache-2.0, and no
# dependency that compiles C or C++ in the default build (SPEC 20).

[graph]
all-features = true
# Bans and licenses apply to the production graph. Dev-only dependencies
# (loom pulls generator -> cc) never ship; the cc/cmake/bindgen bans below
# still hold for everything a user builds.
exclude-dev = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The only difference from the root policy (#367, coordinator's decision of
# 2026-11-24): `colored`, an unconditional dependency of burn-tensor, is
# MPL-2.0 (file-level copyleft; used unmodified). Nothing else may use it.
exceptions = [{ crate = "colored", allow = ["MPL-2.0"] }]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "bindgen", reason = "SPEC 20: no native build dependencies" },
    { name = "cc", reason = "SPEC 20: no C or C++ compilation in the default build" },
    { name = "cmake", reason = "SPEC 20: no C or C++ compilation in the default build" },
    { name = "pkg-config", reason = "SPEC 20: no system libraries in the default build" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
