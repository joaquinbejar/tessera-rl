#
# Learns-at-all parameters per learning protocol (tools/learning_gate.learns,
# #370). A calibration learns only if the bootstrap 95% interval of
# median(score) - mean(random policy score) lies above min_effect times
# (solved - mean(random)), and the scores are not degenerate (constant). The
# solved scores are the Gymnasium reward thresholds where one exists, or the
# environment's best episode score. They are kept apart from protocols.toml,
# so changing them does not change a protocol's fingerprint.

[cartpole]
solved = 475.0
min_effect = 0.10

[acrobot]
solved = -100.0
min_effect = 0.10

[mountaincar]
solved = -110.0
min_effect = 0.10

[grid]
# Every episode reaches the goal (+1).
solved = 1.0
min_effect = 0.10

[pendulum]
# A common "solved" level (Gymnasium names no reward threshold for it); a
# random policy scores about -1200 per 200-step episode.
solved = -200.0
min_effect = 0.10

[snake]
# Eats once and does not die: the full-board score is far beyond a 500k-step
# budget. A random policy scores about -0.95 (it dies before eating). The
# calibrated median is 0.15 (threshold 0.0): a weak learner, so this gate
# catches regressions toward the random policy, not a loss of skill.
solved = 1.0
min_effect = 0.10

[paddleduel]
# An upper bound on the reachable episode return: 11 points (an 11-0 win)
# plus 0.1 per own hit (bounce = 1 tenth). The ball's horizontal speed is
# always 6 and a return crosses 568 px between the faces each way, so own
# hits are at least 2 * ceil(568 / 6) = 190 frames apart; an episode is at
# most 5000 decisions * 4 frames = 20000 frames (the Gymnasium limit), so at
# most floor(19999 / 190) + 1 = 106 own hits: 11 + 106 * 0.1 = 21.6. A random
# policy loses about 0-11.
solved = 21.6
min_effect = 0.10

# Tier T3b (#370, DESIGN-T3b-r1 section 2, REVIEW-T3b-r1;
# tools/learning_gate.learns_twoplayer). U: a uniform-legal player in the
# learner's seat against the heuristic; H: the heuristic against itself;
# both per episode on the evaluation seeds, over the protocol's seats.
# - No gate when the bootstrap 95% lower bound of mean(H) - mean(U) <= 0.
# - Threshold 1: lower95(mean(trained vs heuristic) - mean(U))
#   >= min_effect * (mean(H) - mean(U)).
# - Threshold 2: lower95(mean(trained vs uniform-legal opponent)) > 0.
# A protocol learns only when both hold and its scores are not degenerate.
# Tier T3b (#370): calibration on T3B_CALIBRATION_SEEDS = 101..110 (10
# seeds), the nightly threshold at their minimum (tools/learning_gate.py).
# Per-night false-red estimate, exchangeable draws: C(5,3)/C(15,3) = 2.2%
# (against 8.3% with 5 calibration seeds; rev's ruling).
[connect4]
min_effect = 0.10

[othello]
min_effect = 0.10

[go9]
min_effect = 0.10

[leduc]
min_effect = 0.10

[tag]
min_effect = 0.10

[jobshop]
# The MWKR dispatching rule's mean return on the 20 evaluation seeds (minus
# the mean makespan; `Rule::Mwkr`). SPT, the environment's Heuristic,
# scores below a random policy on makespan (-1134.0 against -856.4), so it is
# not the bar. The makespan lower bound is -413.1 on the same seeds.
solved = -648.15
min_effect = 0.10

[vrp]
# The nearest-feasible-neighbour baseline's mean return on the 20 evaluation
# seeds (minus the mean tour length; tessera-rl-ops' Heuristic). A random
# legal policy scores -1568.8.
solved = -792.05
min_effect = 0.10
