#
# Learning protocols (SPEC 16.1, 18; tools/learning_protocols.py, #370). One
# table per environment: its id, tier, the adapter path a run goes through,
# hyperparameters overriding reference_training.Hyper (CleanRL's discrete PPO
# defaults), and the calibration budget. A protocol's calibration fingerprint
# covers only its own table, so editing one protocol invalidates only its own
# calibration (a reviewed re-calibration, like a gungraun re-bless).
#
# Learning thresholds are host-specific. Single-threaded training is
# deterministic on one machine, but the same protocol and seeds give
# different scores on different CPUs (torch CPU kernels differ):
# - Acrobot's threshold at 150k steps was -295.3 on one Intel host and
#   -348.75 on an AMD host.
# So a committed calibration is made on the nightly host itself; a
# calibration from any other machine is a pilot, never committed. A
# calibration records the CPU, and the torch and OpenMP thread settings, it
# ran with.
#
# Protocols without a calibration have no nightly gate yet (the owner's
# rule: an environment that does not learn at an affordable budget ships its
# protocol without one). At 150k steps:
# - MountainCar scores -200, the same as a random policy (sparse reward).
# - Grid scores -0.9 on every seed against -1.0 for random: 1 goal in 20
#   evaluation episodes. It passes the numeric learns check, but that is not
#   learning to reach the goal.
# - BrickWall scores 0.0 against 0.7 for random (an MLP on pixels).
# A larger budget, other hyperparameters or a CNN would be a later protocol
# change.

[cartpole]
env = "tessera/CartPole-v1"
tier = "T1"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 150000
hyper = {}

[acrobot]
env = "tessera/Acrobot-v1"
tier = "T1"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 150000
hyper = {}

# No calibration, so no nightly gate (#370, decided): at these CleanRL
# defaults the pilot scored -200 on every seed, the same as a random policy.
# RL Zoo's working PPO setup (hyperparams/ppo.yml at v2.9.2, MountainCar-v0)
# needs observation and reward normalization, which the T1 trainer lacks;
# adding it there would invalidate the calibrated T1 protocols. A separate
# normalized T1 trainer is #530.
[mountaincar]
env = "tessera/MountainCar-v1"
tier = "T1"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 150000
hyper = {}

# No calibration, so no nightly gate (#370, decided): at these CleanRL
# defaults the xaskar calibration was degenerate (-0.9 on every seed).
[grid]
env = "tessera/Grid-v1"
tier = "T1"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 150000
hyper = {}

# No calibration, so no nightly gate (#370, decided): at these CleanRL
# defaults the pilot scored 0.0 on both seeds, against 0.7 for a random policy.
[brickwall]
env = "tessera/BrickWall-v1"
tier = "T1"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 150000
hyper = {}

[pendulum]
env = "tessera/Pendulum-v1"
tier = "T2"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 500000
hyper = {}

# Tier T3a: action masks, one learner (agents=1), learning_masked.py.
[snake]
env = "tessera/Snake-v1"
tier = "T3a"
adapter = "tessera_rl.gym (SAME_STEP, agents=1, info action_mask)"
total_steps = 500000
hyper = {}
env_kwargs = { obs = "state" }

[paddleduel]
env = "tessera/PaddleDuel-v1"
tier = "T3a"
adapter = "tessera_rl.gym (SAME_STEP, agents=1, scripted right paddle)"
total_steps = 500000
hyper = {}
env_kwargs = { obs = "state" }

# tessera/LimitOrderBook-v1 (#381, design section 5): tier T3, multi-agent
# and masked. Not run by tools/learning_protocols.py (single-agent
# Gymnasium only): tools/lob_training.py runs it, slot 0 learning through
# tessera_rl.pz against ADR-0079 heuristic slots 1 to 7 (the environment's
# own market-maker, noise and momentum mix, #470), and passes when the
# bootstrap 95% interval of the trained score minus a Python noise trader's
# in slot 0 lies above 0. The engine's own slot-0 baseline is reported too,
# for information. The opponents changed in #470, so #381's numbers no
# longer apply. No calibration, so no nightly gate. The design's 20M steps
# assume vectorized pools; this reference loop steps one Parallel
# environment, so its budget is 2M learner steps until it is measured.
[lob]
env = "tessera/LimitOrderBook-v1"
tier = "T3"
adapter = "tessera_rl.pz parallel_env (slot 0 learner, ADR-0079 heuristic slots 1 to 7 as opponents; tools/lob_training.py)"
total_steps = 2000000
hyper = {}
config = { agents = 8, steps = 200, latency = 0 }
seeds = 5
eval_episodes = 10
