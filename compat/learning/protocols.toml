#
# Learning protocols (SPEC 16.1, 18; tools/learning_protocols.py, #370). One
# table per environment: its id, tier, the adapter path a run goes through,
# hyperparameters overriding reference_training.Hyper (CleanRL's discrete PPO
# defaults), and the calibration budget. A protocol's calibration fingerprint
# covers only its own table, so editing one protocol invalidates only its own
# calibration (a reviewed re-calibration, like a gungraun re-bless).
#
# Learning thresholds are host-specific. Single-threaded training is
# deterministic on one machine, but the same protocol and seeds give
# different scores on different CPUs (torch CPU kernels differ):
# - Acrobot's threshold at 150k steps was -295.3 on one Intel host and
#   -348.75 on an AMD host.
# So a committed calibration is made on the nightly host itself; a
# calibration from any other machine is a pilot, never committed. A
# calibration records the CPU, and the torch and OpenMP thread settings, it
# ran with.
#
# Protocols without a calibration have no nightly gate yet (the owner's
# rule: an environment that does not learn at an affordable budget ships its
# protocol without one). At 150k steps:
# - MountainCar scores -200, the same as a random policy (sparse reward);
#   it moved to the normalized tier T1n (#530).
# - Grid scores -0.9 on every seed against -1.0 for random: 1 goal in 20
#   evaluation episodes. It passes the numeric learns check, but that is not
#   learning to reach the goal.
# - BrickWall scores 0.0 against 0.7 for random (an MLP on pixels).
# A larger budget, other hyperparameters or a CNN would be a later protocol
# change.

[cartpole]
env = "tessera/CartPole-v1"
tier = "T1"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 150000
hyper = {}

[acrobot]
env = "tessera/Acrobot-v1"
tier = "T1"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 150000
hyper = {}

# Tier T1n (#530): at the T1 CleanRL defaults the pilot scored -200 on every
# seed, the same as a random policy (#370). This is RL Zoo's working PPO
# setup (hyperparams/ppo.yml at v2.9.2, sha256 3eb424c8, MountainCar-v0:
# normalize, 16 envs, n_steps 16, gae_lambda 0.98, 4 epochs, ent_coef 0, 1e6
# steps; batch_size 64, so 4 minibatches of 256) on the normalized trainer,
# learning_normalized; the rest are SB3 PPO defaults (NormalizedHyper). No
# deviation from the RL Zoo entry; the 1e6-step budget is pre-declared, with
# one pilot and no tuning loop. A new protocol: no T1 calibration carries
# over. Calibrated on the nightly host (mountaincar.json, #530): median
# -114.85 against -200 for random, so it has a nightly job.
[mountaincar]
env = "tessera/MountainCar-v1"
tier = "T1n"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 1000000
hyper = { num_envs = 16, num_steps = 16, gae_lambda = 0.98, update_epochs = 4, ent_coef = 0.0, num_minibatches = 4 }

# No calibration, so no nightly gate (#370, decided): at these CleanRL
# defaults the xaskar calibration was degenerate (-0.9 on every seed).
[grid]
env = "tessera/Grid-v1"
tier = "T1"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 150000
hyper = {}

# No calibration, so no nightly gate (#370, decided): at these CleanRL
# defaults the pilot scored 0.0 on both seeds, against 0.7 for a random policy.
[brickwall]
env = "tessera/BrickWall-v1"
tier = "T1"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 150000
hyper = {}

# tessera/Gather-v1 (#370, single-agent, so T1 rather than T3b): +1 per item
# collected, terminated when all are, truncated at the step cap. Its Dict
# observation (agent, the items Set and its mask) goes through the T1
# flattening. CleanRL defaults and the T1 budget, pre-declared (no tuning
# loop). No calibration, so no nightly gate under T1's greedy protocol: the
# greedy evaluation collapses into loops on the grid (median 1.05 items on the
# 40 calibration seeds), while the sampling policy improves on random (5.2 vs
# 4.55, seed 101's training curve). Not a pipeline fault: a scripted greedy
# collector gets all 8 items through the same gym and flattening paths (#593).
# Tier T1s (#595): T1's training unchanged, with a sampled evaluation
# (learning_sampled). The budget stays T1's 150k, pre-declared, with one
# pilot and no tuning loop. Calibrated on the nightly host (main 76067fb9):
# it learns a little, not enough. Median 5.2 against 4.55 for random, 39 of
# 40 seeds above it (scores 4.45 to 5.7, no outlier), but the gap's 95%
# interval [-0.125, 1.4] does not clear the pre-declared bar of 0.345
# (min_effect 0.10 of solved 8.0 minus random), so learns is false (#595).
# No calibration file and no nightly gate; changing the evaluation episodes
# after this result would be a tuning loop.
[gather]
env = "tessera/Gather-v1"
tier = "T1s"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 150000
hyper = {}

[pendulum]
env = "tessera/Pendulum-v1"
tier = "T2"
adapter = "tessera_rl.gym (SAME_STEP)"
total_steps = 500000
hyper = {}

# Tier T3a: action masks, one learner (agents=1), learning_masked.py.
[snake]
env = "tessera/Snake-v1"
tier = "T3a"
adapter = "tessera_rl.gym (SAME_STEP, agents=1, info action_mask)"
total_steps = 500000
hyper = {}
env_kwargs = { obs = "state" }

[paddleduel]
env = "tessera/PaddleDuel-v1"
tier = "T3a"
adapter = "tessera_rl.gym (SAME_STEP, agents=1, scripted right paddle)"
total_steps = 500000
hyper = {}
env_kwargs = { obs = "state" }

# tessera/LimitOrderBook-v1 (#381, design section 5): tier T3, multi-agent
# and masked. Not run by tools/learning_protocols.py (single-agent
# Gymnasium only): tools/lob_training.py runs it, slot 0 learning through
# tessera_rl.pz against ADR-0079 heuristic slots 1 to 7 (the environment's
# own market-maker, noise and momentum mix, #470), and passes when the
# bootstrap 95% interval of the trained score minus a Python noise trader's
# in slot 0 lies above 0. The engine's own slot-0 baseline is reported too,
# for information. The opponents changed in #470, so #381's numbers no
# longer apply. No calibration, so no nightly gate. The design's 20M steps
# assume vectorized pools; this reference loop steps one Parallel
# environment, so its budget is 2M learner steps until it is measured.
[lob]
env = "tessera/LimitOrderBook-v1"
tier = "T3"
adapter = "tessera_rl.pz parallel_env (slot 0 learner, ADR-0079 heuristic slots 1 to 7 as opponents; tools/lob_training.py)"
total_steps = 2000000
hyper = {}
config = { agents = 8, steps = 200, latency = 0 }
seeds = 5
eval_episodes = 10

# Tier T3b (#370, design docs/reviews/370/DESIGN-T3b-r1.md, REVIEW-T3b-r1):
# one masked-PPO learner against ADR-0079 heuristic slots, over the native
# Env (tools/learning_twoplayer.py; the board games are PettingZoo AEC only).
# ``seats``: the learner's slots, alternating by seed (even seeds the first);
# evaluation splits ``eval_episodes`` evenly over them. ``score``: "sign"
# scores an episode +1, 0 or -1 from the learner's seat; "return" uses the
# return. ``total_steps`` counts the learner's own turns. The thresholds are
# in gates.toml. Calibrated on xaskar (#370, 10 seeds, threshold = their
# minimum): connect4, othello, go9 and tag learn and run nightly. The nightly
# gates "learns" (both thresholds: closing part of the gap from uniform play
# towards the heuristic, and beating uniform play), not "beats the heuristic":
# Connect4's median against the heuristic is -0.24 (REVIEW-T3b-calibration-r1); leduc has no
# gate, because lower95(H - U) = -0.34 <= 0 (its heuristic does not beat
# uniform play, so there is no gap to close; docs/reviews/370/cal-final;
# follow-up #559).
# T3b evaluation openings (#370; rev's ruling on the deterministic-evaluation
# finding): opening_plies uniform legal plies by both sides, drawn from each
# evaluation episode's seed, identical for every player kind and both seats;
# an opening that ends the game or leaves no legal move is redrawn up to 16
# times, then that episode is skipped by all (learning_twoplayer.openings).
# Leduc and Tag: 0, since their deals and slip already vary each episode.
# T3b (#370, DESIGN-T3b-r1): total_steps counts the learner's own stored
# transitions (its acting steps), not engine steps; the opponent's turns are
# not counted.
# Step cap 64 (make()'s default) > the longest legal game, 42 plies, so a
# truncation never cuts a game short and ends it without a bootstrap.
[connect4]
opening_plies = 2
env = "tessera/Connect4-v1"
tier = "T3b"
adapter = "tessera_rl.make (native Env, sync, policy_map: the other seat a heuristic slot)"
total_steps = 1000000
hyper = {}
seats = [0, 1]
score = "sign"
seeds = 5
eval_episodes = 50

# Step cap 128 (make()'s default) > the longest legal game, 119 plies.
[othello]
opening_plies = 4
env = "tessera/Othello-v1"
tier = "T3b"
adapter = "tessera_rl.make (native Env, sync, policy_map: the other seat a heuristic slot)"
total_steps = 1000000
hyper = {}
seats = [0, 1]
score = "sign"
seeds = 5
eval_episodes = 50

# Step cap 200 (make()'s default) > the game's own cap of 162 plies.
[go9]
opening_plies = 4
env = "tessera/Go9-v1"
tier = "T3b"
adapter = "tessera_rl.make (native Env, sync, policy_map: the other seat a heuristic slot)"
total_steps = 2000000
hyper = {}
seats = [0, 1]
score = "sign"
seeds = 5
eval_episodes = 50

# Step cap 16 (make()'s default) > the longest hand, 8 actions.
[leduc]
opening_plies = 0
env = "tessera/Leduc-v1"
tier = "T3b"
adapter = "tessera_rl.make (native Env, sync, policy_map: the other seat a heuristic slot, InfoHeuristic)"
total_steps = 500000
hyper = {}
seats = [0, 1]
score = "sign"
seeds = 5
eval_episodes = 50

# Tag: the learner is slot 0, a pursuer, against heuristic slots for every
# other agent (the window-limited InfoHeuristic, #437 closed by #347); the
# roles are asymmetric, so the seat does not alternate, and the score is the
# return.
# Tag's score (REVIEW-T3b-head-r1 item 3): score = "return", the pursuer's
# undiscounted episode return. Each capture adds +1 for every pursuer on the
# evader's cell (tag/mod.rs), so the score counts the learner's captures; an
# episode with no capture before the cap scores 0. Tag ends by the 200-step
# cap (make()'s default), and that truncation is bootstrapped from the
# terminal observation (learning_twoplayer.truncation_bootstrap), not treated
# as a terminal end.
[tag]
opening_plies = 0
env = "tessera/Tag-v1"
tier = "T3b"
adapter = "tessera_rl.make (native Env, sync, policy_map: every other slot a heuristic slot, InfoHeuristic)"
total_steps = 1000000
hyper = {}
seats = [0]
score = "return"
seeds = 5
eval_episodes = 50

# tessera/JobShop-v1 (#383 stage 4): tier T3a, one dispatching agent with a
# mask over unfinished jobs; the Dict observation is flattened as in T1. The
# return is minus the final makespan, so a better schedule scores higher.
[jobshop]
env = "tessera/JobShop-v1"
tier = "T3a"
adapter = "tessera_rl.gym (SAME_STEP, info action_mask)"
total_steps = 500000
hyper = {}
env_kwargs = { jobs = 6, machines = 6 }

# tessera/Vrp-v1 (#383 stage 4): tier T3a with one vehicle (slot 0 through
# tessera_rl.gym, as Snake and PaddleDuel), masked over customers and the
# depot. The return is minus the distance travelled. Fleets (several
# vehicles, PettingZoo AEC) are not in this tier.
[vrp]
env = "tessera/Vrp-v1"
tier = "T3a"
adapter = "tessera_rl.gym (SAME_STEP, vehicles=1, info action_mask)"
total_steps = 500000
hyper = {}
env_kwargs = { customers = 20, vehicles = 1 }

# tessera/Survival-v1 (#382 stage 4): listed only, with no calibration and no
# gate (#618 calibrates it, a timing pilot first). The calibration must keep:
# - learner seat: slot 0 (`seats`); every other slot is a heuristic slot
#   (the scripted baseline, an InfoHeuristic from its own window);
# - agent count and config: `env_kwargs` (32 agents on a 48x48 map, respawn
#   16, 512-step episodes);
# - score: "return", the learner's undiscounted episode return, +1 per step
#   alive, so the score counts the steps it survived.
# Survival's actions are two independent heads (MultiDiscrete [5, 7]); the T3b
# trainer is one-head today, so two-head training is part of #618.
[survival]
opening_plies = 0
env = "tessera/Survival-v1"
tier = "T3b"
adapter = "tessera_rl.make (native Env, sync, policy_map: every slot but 0 a heuristic slot, InfoHeuristic)"
total_steps = 1000000
hyper = {}
env_kwargs = { agents = 32, size = 48, respawn = 16, steps = 512 }
seats = [0]
score = "return"
seeds = 5
eval_episodes = 20
