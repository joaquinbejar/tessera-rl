#
# The PufferLib conformance environment ([env.pufferlib] in
# compat/targets.toml), separate because PufferLib 3.0.0 cannot be
# installed next to Gymnasium 1.x.

[project]
name = "tessera-rl-conformance-pufferlib"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pufferlib==3.0.0",
    "gymnasium==0.29.1",
    "pettingzoo==1.24.1",
    "numpy==1.26.4",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false
