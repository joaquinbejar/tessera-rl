#
# Reference machines (ADR-0025). Performance claims and gates name one of
# these. A machine that is not characterized yet is a candidate: results on
# it are indicative, not binding.

format = 1

[ref-x86]
# A candidate: SPEC 19.3 requires a dedicated machine for wall-clock gates,
# and xaskar is shared. A recorded turbo state, an idle SMT sibling and a
# low coefficient of variation do NOT by themselves promote a shared host:
# it needs a measured exclusive window. Until then its wall-clock results
# are indicative and the binding G1 gate is pending. It is valid for
# bit-exactness (golden suites, math-diff) and for instruction counts
# (gungraun), which do not depend on load.
status = "candidate"
wall_clock_gates = "pending: needs an exclusive window"
valid_for = ["golden", "math-diff", "instruction-counts"]
host = "xaskar (shared host, about 20 containers; record the load with every run)"
cpu = "Intel Core i7-12700H (Alder Lake, hybrid)"
cores = "6 P-cores with HT (CPUs 0-11, up to 4.7 GHz); 8 E-cores (CPUs 12-19, up to 3.5 GHz)"
isa = "x86-64, AVX2, no AVX-512"
memory = "62 GiB"
os = "Ubuntu 26.04.1"
kernel = "7.0.0-38"
frequency_policy = "governor performance"
# Hybrid CPU: single-core benches (G1 and every wall-clock bench) run pinned
# to one P-core with `taskset -c 2` (CPU 0 avoided), with its SMT sibling
# (CPU 3) left idle.
bench_pinning = "taskset -c 2"
# CPUs the harness pins to (tools/bench): distinct physical P-cores, CPU 0
# avoided, SMT siblings (3, 5, 7, 9) left idle. Single-core runs use the
# first; a k-worker run uses the first k.
bench_cpu_set = [2, 4, 6, 8]
turbo = ""
noise_floor_cv = ""
toolchain = "rustc and cargo 1.99.1 (system), valgrind 3.26.0, gcc 15.2"

[ref-mac]
status = "pending characterization"
candidate = "Mac Studio M5 (the development machine)"
cpu = "Apple M5 Max (18 cores)"
memory = ""
os = ""
frequency_policy = ""

# Secondary validation only, not a reference for performance gates.
[ref-mac-alt]
status = "pending characterization"
candidate = "Mac Studio M4"
cpu = ""
memory = ""
os = ""
frequency_policy = ""

# Linux on ARM64. Docker linux/arm64 on the M5 is not a reference machine.
[ref-arm]
status = "pending: no host"
candidate = ""

[ref-gpu]
status = "pending characterization (powered on on demand)"
# Windows 10 is out of support upstream; noted for the reference record.
candidate = "Windows 10 machine with an RTX 4090"
cpu = ""
gpu = ""
memory = ""
os = ""
driver = ""
frequency_policy = ""
