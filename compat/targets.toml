# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Conformance targets (ADR-0027): exact versions the conformance suites run
# against. Upgrading a target is a deliberate PR that reruns those suites.
# `make check-targets` verifies an installed environment against this file.
#
# Pinned on 2026-10-31 to the latest stable releases on PyPI.

format = 1

[python]
# abi3-py311 wheels; standard (GIL) builds only.
minimum = "3.11"
# 3.15 is added when it is released.
tested = ["3.11", "3.12", "3.13", "3.14"]

# The main conformance environment: the Gymnasium adapter (phase 1b), the
# PettingZoo adapters, JAX and onnxruntime (later phases).
[env.main]
gymnasium = "1.4.0"
pettingzoo = "1.27.0"
numpy = "2.4.6"
torch = "2.15.0"
jax = "0.10.2"
onnxruntime = "1.31.1"

# PufferLib 3.0.0 requires pettingzoo <= 1.24.1, and with it gymnasium
# 0.29.1 and numpy < 2, which cannot be installed next to [env.main]
# (`uv lock` finds no solution). Its adapter (phase 2) is therefore tested
# in this separate environment, with the versions PufferLib resolves. To be
# revisited, and merged into [env.main], once a PufferLib release supports
# Gymnasium 1.x. It is its own uv project: compat/pufferlib/
# (make check-targets ENV=pufferlib).
[env.pufferlib]
pufferlib = "3.0.0"
gymnasium = "0.29.1"
pettingzoo = "1.24.1"
numpy = "1.26.4"

# Profiles for `make check-targets PROFILE=...`: which targets must be
# installed (required: a missing one fails the check) and which are only
# reported (deferred: listed with their state, never failed). Every name refers to a pin
# above in the profile's environment.
# The bare tool environment (no dependency group): only Python is checked.
[profile.b1]
env = "main"
required = []
deferred = ["gymnasium", "pettingzoo", "numpy", "torch", "jax", "onnxruntime"]

[profile.test]
env = "main"
required = ["numpy", "gymnasium", "pettingzoo"]
deferred = ["torch", "jax", "onnxruntime"]

[profile.torch]
env = "main"
required = ["numpy", "gymnasium", "pettingzoo", "torch"]
deferred = ["jax", "onnxruntime"]

[profile.conformance]
env = "main"
required = ["gymnasium", "pettingzoo", "numpy", "torch", "jax", "onnxruntime"]
deferred = []

[profile.pufferlib]
env = "pufferlib"
required = ["pufferlib", "gymnasium", "pettingzoo", "numpy"]
deferred = []
