# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "tessera-rl-league"
description = "Tessera league machinery: populations, Elo and TrueSkill ratings, PFSP and Elo matchmaking (ADR-0026, ADR-0088)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The pool side of a league (ADR-0088 erratum 1): this crate implements the
# engine's league subsystem, so it depends on the engine, never the reverse.
tessera-rl-engine.workspace = true
tessera-rl-num.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
# The replay refusal of a league pool (ADR-0088 section 8, until head D).
tessera-rl-engine = { workspace = true, features = ["replay"] }
tessera-rl-classic.workspace = true
tessera-rl-core.workspace = true
proptest.workspace = true

[lints]
workspace = true

[[bench]]
name = "league_barrier"
harness = false

[[bench]]
name = "onnx_pass"
harness = false
