# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "tessera-rl"
description = "Fast, deterministic, forkable reinforcement learning environments in Rust"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# SPEC 20.1. `search` and `simd` are on by default, which keeps the API of
# 0.3.0; `onnx` (ADR-0057, the load-dynamic glue only) is opt-in and
# implies `search`.
default = ["search", "simd"]
search = ["dep:tessera-rl-search"]
simd = ["dep:tessera-rl-simd"]
onnx = ["search", "dep:tessera-rl-onnx", "tessera-rl-onnx/onnx"]
# ADR-0083: `tessera_rl::render`, the scene rasterizer. Off by default.
render = ["dep:tessera-rl-render"]
# SPEC 5.5: strict checks at the validation boundary, forwarded to the
# engine (see `tessera_rl::engine::DEBUG_CHECKS`).
debug-checks = ["tessera-rl-engine/debug-checks"]

[dependencies]
tessera-rl-core.workspace = true
tessera-rl-num.workspace = true
tessera-rl-macros.workspace = true
tessera-rl-engine.workspace = true
tessera-rl-classic.workspace = true
tessera-rl-games.workspace = true
tessera-rl-search = { workspace = true, optional = true }
tessera-rl-simd = { workspace = true, optional = true }
tessera-rl-onnx = { workspace = true, optional = true }
tessera-rl-render = { workspace = true, optional = true }

[lints]
workspace = true
