debug-checks = ["tessera-rl-engine/debug-checks"]

[dependencies]
tessera-rl-core.workspace = true
tessera-rl-num.workspace = true
tessera-rl-macros.workspace = true
tessera-rl-engine.workspace = true
tessera-rl-classic.workspace = true
tessera-rl-games.workspace = true
tessera-rl-search.workspace = true

[lints]
workspace = true
