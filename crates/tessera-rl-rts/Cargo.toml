[package]
name = "tessera-rl-rts"
description = "Tessera's RTS environment (tessera/RTS-v1): world, map generator and turn resolution"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tessera-rl-core.workspace = true
tessera-rl-num.workspace = true
tessera-rl-macros.workspace = true

[dev-dependencies]
criterion.workspace = true
tessera-rl-engine = { workspace = true, features = ["test-hooks"] }
# The search pool refuses this environment under fog (ADR-0035).
tessera-rl-search.workspace = true

[lints]
workspace = true

[[bench]]
name = "flow"
harness = false

# The step through the engine; local only, no claim.
[[bench]]
name = "step"
harness = false
