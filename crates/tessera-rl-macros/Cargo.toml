[package]
name = "tessera-rl-macros"
description = "Derive macros for Tessera environment state, config and observations"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
# Path-only: crates.io strips them, so publishing this crate does not
# need the facade or core (published after it) on crates.io first.
tessera-rl = { path = "../tessera-rl" }
tessera-rl-core = { path = "../tessera-rl-core" }
tessera-rl-num.workspace = true
trybuild.workspace = true

[lints]
workspace = true
