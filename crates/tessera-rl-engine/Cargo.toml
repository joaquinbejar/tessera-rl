# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "tessera-rl-engine"
description = "Instance storage, scheduling, snapshot, restore and fork for Tessera"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Strict checks (SPEC 5.5): illegal actions reject the call atomically
# instead of being replaced. Off by default.
debug-checks = []

[dependencies]
tessera-rl-core.workspace = true
tessera-rl-num.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(loom))'.dependencies]
core_affinity.workspace = true

[target.'cfg(all(not(loom), any(target_os = "linux", target_os = "macos")))'.dependencies]
libc.workspace = true

[target.'cfg(all(not(loom), windows))'.dependencies]
windows-sys.workspace = true

[target.'cfg(loom)'.dev-dependencies]
loom.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
gungraun.workspace = true
tessera-rl-num = { workspace = true, features = ["test-hooks"] }
tessera-rl-macros.workspace = true

[lints]
workspace = true

[[bench]]
name = "sync_step"
harness = false

# Pipelined send and recv against a Sync step (ADR-0047).
[[bench]]
name = "pipelined_step"
harness = false

# Async id ring push and pop (ADR-0047).
[[bench]]
name = "id_rings"
harness = false

# Instruction counts (gungraun, Linux only; ADR-0025).
[[bench]]
name = "snapshot_instructions"
harness = false

# Instruction counts of masked and turn-based steps (P2-M1a).
[[bench]]
name = "turns_instructions"
harness = false
