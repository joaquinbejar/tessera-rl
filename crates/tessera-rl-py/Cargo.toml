# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "tessera-rl-py"
description = "Python bindings for Tessera (PyO3, abi3-py311)"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
# Test-only failure injection (`_native._fail_after`), for the ADR-0041
# unwind tests (`make py-test-hooks`). Never in a release wheel.
test-hooks = []

[dependencies]
pyo3.workspace = true
tessera-rl-core.workspace = true
tessera-rl-num.workspace = true
tessera-rl-engine.workspace = true
tessera-rl-classic.workspace = true

[dev-dependencies]
# Hostile floating-point modes for the boundary tests (ADR-0041).
tessera-rl-num = { workspace = true, features = ["test-hooks"] }

[build-dependencies]
pyo3-build-config = "0.30"

[lints]
workspace = true
