[package]
name = "tessera-rl-classic"
description = "Classic Tessera environments: CartPole and Tag"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tessera-rl-core.workspace = true
tessera-rl-num.workspace = true
tessera-rl-simd.workspace = true
tessera-rl-macros.workspace = true

[dev-dependencies]
# The hostile floating-point mode of the lane differential.
tessera-rl-num = { workspace = true, features = ["test-hooks"] }
proptest.workspace = true
criterion.workspace = true
gungraun.workspace = true
tessera-rl-engine = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true

[[bench]]
name = "classic_step"
harness = false

# Instruction counts (gungraun, Linux only; ADR-0025).
[[bench]]
name = "classic_instructions"
harness = false
