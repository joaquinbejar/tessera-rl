# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "tessera-rl-classic"
description = "Classic Tessera environments: classic control (CartPole, Acrobot, MountainCar, Pendulum), grid worlds, Snake, PaddleDuel, BrickWall, Gather and Tag"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tessera-rl-core.workspace = true
tessera-rl-num.workspace = true
tessera-rl-simd.workspace = true
tessera-rl-macros.workspace = true

[dev-dependencies]
# The hostile floating-point mode of the lane differential.
tessera-rl-num = { workspace = true, features = ["test-hooks"] }
proptest.workspace = true
criterion.workspace = true
gungraun.workspace = true
tessera-rl-engine = { workspace = true, features = ["test-hooks", "replay"] }

[lints]
workspace = true

[[bench]]
name = "classic_step"
harness = false

# The CartPole lane gain per SIMD level (issue #152 P5).
[[bench]]
name = "cartpole_lanes"
harness = false

# The 1.2x stop of ADR-0071: the lane path against the scalar step.
[[bench]]
name = "cartpole_lane_stop"
harness = false

# Instruction counts (gungraun, Linux only; ADR-0025).
[[bench]]
name = "classic_instructions"
harness = false

# The gather cost of a lane-wise pool's snapshots and forks (ADR-0090 7).
[[bench]]
name = "soa_snapshot"
harness = false

# The live watch acceptance benchmark (ADR-0083 item 7, #378 4d).
[[bench]]
name = "watch_step"
harness = false
