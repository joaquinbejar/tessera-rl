outputs = "owned"
num_envs = 64

# Head-to-head baseline: Gymnasium's own CartPole-v1 in a SyncVectorEnv,
# same number of environments, NEXT_STEP auto-reset, same action stream.
[[config]]
name = "py/gymnasium-sync/cartpole/n64"
kind = "python"
api = "gymnasium"
num_envs = 64

# Head-to-head against EnvPool (SPEC 19.1, 19.2, #371): the same dynamics,
# action plan and options, one thread each (Tessera Inline through the native
# borrowed API; EnvPool's synchronous API with one worker thread).
# The outputs differ: Tessera's borrowed views against EnvPool's fresh arrays
# and info dict, so each derived speedup carries that note. Needs the
# `envpool` package (Linux x86-64 wheels), which is not a project dependency:
# without it these configurations are skipped and the report lists them under
# `skipped`.
[[config]]
name = "py/envpool/cartpole/n1024"
kind = "python"
api = "envpool"
requires = "envpool"
env = "cartpole"
num_envs = 1024
workers = 1

[[config]]
name = "py/native/acrobot/n1024/borrowed"
kind = "python"
api = "native"
env = "acrobot"
outputs = "borrowed"
num_envs = 1024

[[config]]
name = "py/envpool/acrobot/n1024"
kind = "python"
api = "envpool"
requires = "envpool"
env = "acrobot"
num_envs = 1024
workers = 1

[[config]]
name = "py/native/mountaincar/n1024/borrowed"
kind = "python"
api = "native"
env = "mountaincar"
outputs = "borrowed"
num_envs = 1024

[[config]]
name = "py/envpool/mountaincar/n1024"
kind = "python"
api = "envpool"
requires = "envpool"
env = "mountaincar"
num_envs = 1024
workers = 1

