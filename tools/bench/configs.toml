# Flagship benchmarks (SPEC 22 phase 4, #640). Each flagship is measured on
# all four SPEC 19.1 metrics at one N: its Inline entry above (one pinned
# core), Sync mode at 4 workers and at the machine's full bench_cpu_set
# (`workers = "full"`, resolved on the machine and recorded in the report),
# with scaling efficiency against the Inline entry, snapshot costs and
# memory. Every multi-worker entry names its schedule (ADR-0076, ADR-0087):
# Dynamic for RTS and Survival, whose step cost varies per instance, Static
# for the others. Numbers stay indicative (valid_for_claims false) until a
# reference machine exists (#151). Scaling efficiency is k-worker Sync
# throughput over k times the Inline throughput ("efficiency vs k×Inline"):
# Inline has no worker threads, so it includes the Sync scheduling
# overhead, and it is not parallel efficiency against one Sync worker.
# `illegal_action_noops` says whether the flagship's throughput includes
# illegal-action no-ops: Lanterns steps legal actions (`legal_actions`),
# the other masked flagships step the shared plan under the no-op
# illegal-action policy, so some of their steps are no-ops.

[[config]]
name = "rust/rts/sync4/n1024"
kind = "rust"
flagship = "tessera/RTS-v1"
illegal_action_noops = true
metric = "throughput"
env = "rts"
num_envs = 1024
workers = 4
schedule = "dynamic"

[[config]]
name = "rust/rts/syncfull/n1024"
kind = "rust"
flagship = "tessera/RTS-v1"
illegal_action_noops = true
metric = "throughput"
env = "rts"
num_envs = 1024
workers = "full"
schedule = "dynamic"

[[config]]
name = "rust/rts/n1024/snapshot"
kind = "rust"
flagship = "tessera/RTS-v1"
illegal_action_noops = true
metric = "snapshot"
env = "rts"
