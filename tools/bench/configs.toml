# Survival keeps N = 256 (its Inline entry, #382), which at the engine's
# default chunk of 64 is only 4 chunks: a larger CPU set would leave
# workers idle by construction and understate the engine's scaling. Its
# multi-worker entries use chunk_size 16 (16 chunks), at least as many
# chunks as the largest bench_cpu_set in compat/machines.toml. The Inline
# entry keeps the default chunk, being a shared catalog entry with no
# workers to feed; the report records `chunk_size` on every row.
[[config]]
name = "rust/survival-16/sync4/n256"
kind = "rust"
flagship = "tessera/Survival-v1"
illegal_action_noops = true
metric = "throughput"
env = "survival-16"
num_envs = 256
workers = 4
schedule = "dynamic"
chunk_size = 16

