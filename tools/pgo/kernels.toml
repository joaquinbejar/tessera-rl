#
# The kernels that must have nonzero profile counts (design section 3). Kept out
# of the manifest so that filling them does not change its version, and out of
# the measurement stamp (the list enters no Ir).
#
# Filled on 2026-11-11 from the real symbols of the W1 wheel of the feasibility
# gate (tessera_rl-0.1.0-cp311-abi3-manylinux_2_28_x86_64.whl, sha256
# ad64a5e1b5b8b283bd87f77bd8d5e441aa2f2f4a4a22aca44eef9da59b26dfdf, built from
# ac92079), each a v0-mangled symbol of its `_native.abi3.so` (see the scope
# below).
# The design said "frozen at the feasibility step"; that did not happen, and the
# freeze point is the merge commit of the PR that adds this list, before any W2
# profile or coverage output exists.
#
# A kernel matches a profile function whose v0-mangled name contains every
# `+`-separated part as a whole v0 identifier: its decimal length prefix, not
# preceded by another digit (an identifier that starts with `_` or a digit has
# v0's `_` separator, as `7__native`). Each kernel names its crate.
#
# Scope (TR F5, ruling 70150): the profile must reach the hot native path of
# every manifest row. So the list is the environment step kernel of every
# environment type, the MCTS stage of the search row, the record import of the
# state-operations row (Sync `import_record`: in Sync mode this row does not
# reach the memcpy `restore` path, design r5), the pipelined split-phase step,
# the threaded rows' worker step (the gang trampoline over par_chunks), and the
# Async batch drain of the holdout split-phase row. Each entry is a function
# that is its own symbol in W1's `_native.abi3.so` (checked against
# tests/python/fixtures/pgo/w1-kernel-symbols.txt), chosen from W1's symbols
# and the manifest alone; no instrumented build or profile was looked at.
#
# [rows] names, per kernel, the manifest rows that reach it. A kernel reached
# only by holdout rows must be ZERO in W2H (trained without the holdout: the
# check that it was really held out) and nonzero in W2F; any other kernel must
# be nonzero in both. Every manifest row reaches at least one kernel.

kernels = [
    "tessera_rl_engine+step_chunk+tessera_rl_classic+CartPole",
    "tessera_rl_engine+step_chunk+tessera_rl_classic+Tag",
    "tessera_rl_engine+step_chunk+tessera_rl_classic+Grid",
    "tessera_rl_engine+step_chunk+tessera_rl_classic+KeyDoor",
    "tessera_rl_engine+step_chunk+tessera_rl_classic+Snake",
    "tessera_rl_engine+step_chunk+tessera_rl_classic+BrickWall",
    "tessera_rl_engine+step_chunk+tessera_rl_games+Connect4",
    "tessera_rl_engine+step_chunk+tessera_rl_games+Othello",
    "tessera_rl_engine+step_chunk+tessera_rl_games+Leduc",
    "tessera_rl_engine+step_chunk+tessera_rl_classic+PaddleDuel",
    "tessera_rl_engine+step_chunk+tessera_rl_games+Go9",
    "tessera_rl_search+mcts+collect_and_stage+tessera_rl_games+Connect4",
    "_native+env_type+import_record",
    "_native+split+pipelined+tessera_rl_classic+CartPole",
    "tessera_rl_engine+gang+trampoline+par_chunks+step_inner+tessera_rl_classic+CartPole",
    "tessera_rl_engine+gang+trampoline+par_chunks+step_inner+tessera_rl_classic+Snake",
    "tessera_rl_engine+batch+run_drain+tessera_rl_classic+CartPole",
]

[rows]
"tessera_rl_engine+step_chunk+tessera_rl_classic+CartPole" = ["state/CartPole-v1", "owned/CartPole-v1"]
"tessera_rl_engine+step_chunk+tessera_rl_classic+Tag" = ["state/Tag-v1-2-2"]
"tessera_rl_engine+step_chunk+tessera_rl_classic+Grid" = ["state/Grid-v1"]
