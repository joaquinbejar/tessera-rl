# SPDX-License-Identifier: MIT OR Apache-2.0

[project]
name = "tessera-rl"
description = "Fast, deterministic, snapshot-able reinforcement learning environments"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
version = "0.1.0"
# Outputs are NumPy arrays; the floor admits both conformance environments
# (numpy 2.4.6 in [env.main], 1.26.4 in [env.pufferlib]).
dependencies = ["numpy>=1.26.4"]

[project.optional-dependencies]
# tessera_rl.gym (the Gymnasium 1.x vector adapter).
gymnasium = ["gymnasium>=1.4.0,<2"]
# tessera_rl.pz (the PettingZoo AEC and Parallel adapters).
pettingzoo = ["pettingzoo>=1.27.0,<2"]
# tessera_rl.jax (the ordered-callback JAX handles, SPEC 15.2). Pinned
# exactly: the ordering guarantees are tested on this version only.
jax = ["jax==0.10.2", "jaxlib==0.10.2"]

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/tessera-rl-py/Cargo.toml"
python-source = "python"
module-name = "tessera_rl._native"

# Development and test tools (ADR-0027 versions from compat/targets.toml).
[dependency-groups]
test = [
    "pytest==9.2.0",
    "numpy==2.4.6",
    "gymnasium==1.4.0",
    "pettingzoo==1.27.0",
]
# Only for the PyTorch DLPack and read-only tests (pytest marker `torch`).
torch = ["torch==2.15.0"]
# Only for the JAX handle tests (pytest marker `jax`).
jax = ["jax==0.10.2", "jaxlib==0.10.2"]
# Only for tools/wheel_golden.py (XXH3-64, the digest of the golden fixtures).
wheels = ["xxhash==4.0.2"]
# Every [env.main] pin of compat/targets.toml, so the lock proves they
# resolve together (make check-targets installs and verifies all of them).
conformance = [
    "gymnasium==1.4.0",
    "pettingzoo==1.27.0",
    "numpy==2.4.6",
    "torch==2.15.0",
    "jax==0.10.2",
    "onnxruntime==1.31.1",
]

[tool.pytest.ini_options]
markers = [
    "torch: needs PyTorch (the `torch` dependency group)",
    "jax: needs JAX (the `jax` dependency group)",
]
# Gymnasium's env checker warns about the infinite velocity bounds of
# CartPole's observation space; it warns identically for Gymnasium's own
# CartPole-v1, whose space ours equals.
filterwarnings = [
    "ignore:.*A Box observation space minimum value is -infinity:UserWarning",
    "ignore:.*A Box observation space maximum value is infinity:UserWarning",
]

[tool.uv]
# `uv sync` builds and installs the native package with maturin's PEP 517
# backend, which builds the release profile; `tessera_rl._native.
# build_profile()` reports what was built.
package = true
default-groups = ["test"]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }]

# CPU wheels of PyTorch on Linux (the default index ships CUDA builds).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
