# SPDX-License-Identifier: MIT OR Apache-2.0

[project]
name = "tessera-rl"
description = "Fast, deterministic, snapshot-able reinforcement learning environments"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/tessera-rl-py/Cargo.toml"
python-source = "python"
module-name = "tessera_rl._native"

# Development and test tools (ADR-0027 versions from compat/targets.toml).
[dependency-groups]
test = [
    "pytest==9.2.0",
    "numpy==2.4.6",
    "gymnasium==1.4.0",
]
# Only for the PyTorch DLPack and read-only tests (pytest marker `torch`).
torch = ["torch==2.15.0"]
# Every [env.main] pin of compat/targets.toml, so the lock proves they
# resolve together (make check-targets installs and verifies all of them).
conformance = [
    "gymnasium==1.4.0",
    "pettingzoo==1.27.0",
    "numpy==2.4.6",
    "torch==2.15.0",
    "jax==0.10.2",
    "onnxruntime==1.31.1",
]

[tool.uv]
# `uv sync` builds and installs the native package (maturin, debug profile
# by default) next to the tool environment.
package = true
default-groups = ["test"]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }]

# CPU wheels of PyTorch on Linux (the default index ships CUDA builds).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
