# SPDX-License-Identifier: MIT OR Apache-2.0

# Records a new instruction-count baseline (ADR-0025 level 1, ADR-0059
# section 5) in the gate's own environment, for an author to commit
# unchanged in the pull request that needs it. Dispatched by hand with the
# branch to bless. It only reads the repository: it never pushes, and its
# token cannot write. The author downloads the one artifact, commits its
# files as they are, and puts this run's id and the artifact's sha256 in
# the pull request; that pull request's own gungraun job then checks them.

name: gungraun bless

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to bless (its baseline files are rewritten in the run, not pushed)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  bless:
    # The gungraun job's runner, container, Valgrind and gungraun-runner
    # (ci.yml): the baseline is only valid in that environment, which
    # tests/python/test_gungraun_bless_workflow.py keeps equal. Only users
    # with write access can dispatch a workflow, and this one has no
    # pull_request trigger, so the ci.yml fork guard has nothing to guard.
    runs-on: [self-hosted, xaskar]
    # A hung Valgrind would otherwise hold the gate's runner for six hours.
    timeout-minutes: 90
    container:
      # The baseline's image, by digest (benches/gungraun/environment.toml).
      image: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
      options: --security-opt seccomp=unconfined
    env:
      TESSERA_GUNGRAUN_IMAGE: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      # The commit this run blesses, for the author to quote and the reviewer
      # to check against the pull request; it is part of the artifact's name.
      # Taken from the checkout action's own output, not from git: the
      # container runs as root over a workspace owned by the runner user, and
      # git refuses that repository ("dubious ownership"). No step runs git.
      # Container steps run under `sh -e` (dash in this image): POSIX only.
      - id: head
        name: the blessed commit
        env:
          COMMIT: ${{ steps.checkout.outputs.commit }}
        run: |
          case "$COMMIT" in
            "" | *[!0-9a-f]*) echo "no checked-out commit from the checkout step: '$COMMIT'" >&2; exit 1 ;;
          esac
          [ "${#COMMIT}" -eq 40 ] || { echo "no checked-out commit from the checkout step: '$COMMIT'" >&2; exit 1; }
          echo "blessed commit: $COMMIT"
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
      - run: apt-get update && apt-get install -y valgrind=1:3.24.0-3
      - run: cargo install --locked gungraun-runner --version 0.20.0
      - run: scripts/gungraun.sh bless
      # Self-test: the new baseline checks against the same build.
      - run: scripts/gungraun.sh check
      - name: sha256 of every baseline file and the manifest
        run: find benches/gungraun -name '*.base@ref' -o -name environment.toml | LC_ALL=C sort | xargs sha256sum
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gungraun-baseline-${{ github.run_id }}-${{ steps.head.outputs.sha }}
          if-no-files-found: error
          path: |
            benches/gungraun/**/*.base@ref
            benches/gungraun/environment.toml
      - name: the artifact's digest
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "artifact ${ARTIFACT_ID} sha256 ${DIGEST}"
      # The container runs as root: give the workspace back to the runner
      # user so the next checkout on the host can clean it.
      - if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"
