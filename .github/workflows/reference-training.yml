# Nightly reference training (SPEC 14.2, ADR-0018): PPO on
# tessera/CartPole-v1 through the Gymnasium adapter against Gymnasium's
# CartPole-v1 (tools/reference_training.py), with broken-adapter negative
# controls that must fail. About 15 minutes on CPU, so it
# runs nightly and on demand, not on every push. The JSON report is
# uploaded as an artifact.

name: Reference training

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-training:
    runs-on: [self-hosted, xaskar]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv is pinned; it fetches CPython 3.11 itself.
      - run: pipx install uv==0.13.6
      # Self-hosted: checkout's git clean deletes the extension module that
      # the editable build put in python/tessera_rl, and uv's persistent
      # cache installs the project again without rebuilding it. Build it
      # explicitly, and check that the extension imports.
      - run: uv sync --locked --python 3.11 --group test --group torch --reinstall-package tessera-rl
      - run: uv run --locked --python 3.11 --group test --group torch python -c "import tessera_rl._native"
      - run: make reference-training
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-training
          path: reference-training.json
