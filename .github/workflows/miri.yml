# SPDX-License-Identifier: MIT OR Apache-2.0

# Nightly Miri run over the audited views and the canonical encoding
# (ADR-0024). Miri needs the nightly toolchain, so this workflow installs it
# explicitly and leaves rust-toolchain.toml untouched.

name: Miri

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miri:
    runs-on: [self-hosted, xaskar]
    env:
      # proptest's failure persistence calls getcwd, which Miri's isolation
      # rejects; turn it off and forward the switch into the interpreter.
      PROPTEST_DISABLE_FAILURE_PERSISTENCE: "1"
      MIRIFLAGS: -Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE
      # Warnings are errors here as in ci.yml, whose workflow env does not
      # reach this file: cfg(miri)-only dead code went unseen (#703).
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component miri
      # The sysroot build is Miri's own, not this repository's code.
      - run: cargo +nightly miri setup
        env:
          RUSTFLAGS: ""
      - run: cargo +nightly miri test -p tessera-rl-core --locked
      - run: "cargo +nightly miri test -p tessera-rl-engine --lib --locked -- buffer:: validate:: transform::"
      # Observation transforms (ADR-0078): the arena, accumulator and
      # scratch views through Inline, Sync, Pipelined and Async pools.
      - run: "cargo +nightly miri test -p tessera-rl-engine --test transforms --locked"
      # The per-instance episode-statistics views of engine::buffer (ADR-0081).
      - run: "cargo +nightly miri test -p tessera-rl-engine --test epoch_barrier --locked"
      # The gang's job publication and trampoline (ADR-0047); FP control
      # asm and address waits are stubbed under cfg(miri), the protocol is not.
      - run: "cargo +nightly miri test -p tessera-rl-engine --lib --locked sys::gang::"
      # The Async id rings and token id buffers (ADR-0047): atomics only.
      - run: "cargo +nightly miri test -p tessera-rl-engine --lib --locked -- sys::ring:: sys::id_buffers:: sys::waiter::"
      # The Pipelined mode end to end (ADR-0047); the 64-worker comparison is
      # too slow under Miri and runs natively.
      - run: "cargo +nightly miri test -p tessera-rl-engine --test pipelined --locked -- --skip bit_for_bit"
      # The Async mode end to end (ADR-0047), including the snapshot taken
      # while other ids run; under Miri the per-instance identity test runs
      # with 2 workers only.
      - run: "cargo +nightly miri test -p tessera-rl-engine --test async_mode --locked -- --skip forgotten"
      # The forgotten-token test leaks its allocation by design (`mem::forget`).
      - run: "cargo +nightly miri test -p tessera-rl-engine --test async_mode --locked -- forgotten"
        env:
          MIRIFLAGS: -Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE -Zmiri-ignore-leaks
      # The Async injected-jitter identity test and the drain of unpublished
      # ids, with 2 workers under Miri.
      - run: "cargo +nightly miri test -p tessera-rl-engine --lib --locked -- modes::async_jitter_tests:: modes::async_wake_tests::"
      # Host pools (ADR-0065): outputs, agent events, aborts and the joint
      # validation, end to end (issue #290).
      - run: "cargo +nightly miri test -p tessera-rl-engine --features host --test host_outputs --test host_agents --test host_abort --test host_validate --locked"
      # The record header after an aborted reset (issue #290).
      - run: "cargo +nightly miri test -p tessera-rl-engine --features host --lib --locked -- host::abort_header_tests::"
      # DLPack export ownership (ADR-0003 rule 1), without an interpreter.
      # The module moved to the shared boundary crate (ADR-0062 item 8); built
      # alone it needs `extension-module` not to link libpython.
      - run: cargo +nightly miri test -p tessera-rl-pyffi --features pyo3/extension-module --lib --locked ffi::dlpack
      # The XLA FFI path (ADR-0095): the shared guard, the registry and the
      # handler on hand-built call frames (the thunk test is ignored: naked
      # assembly). The handler's panic test leaks the payload by design
      # (`ffi::dispose`), so it runs alone with leaks ignored.
      - run: "cargo +nightly miri test -p tessera-rl-pyffi --features pyo3/extension-module,test-hooks --lib --locked -- ffi::inner xla::registry xla::handler --skip test_handler_panic_poisons"
      - run: "cargo +nightly miri test -p tessera-rl-pyffi --features pyo3/extension-module,test-hooks --lib --locked -- test_handler_panic_poisons"
        env:
          MIRIFLAGS: -Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE -Zmiri-ignore-leaks
      # The integer and Fx32 lanes (#345 stage 2): the scalar reference, then
      # the SSE4.2 and AVX2 intrinsics enabled at compile time (Miri's feature
      # detection reports only compile-time features). The 2^18 random sweep
      # is too slow under Miri and runs natively.
      - run: "cargo +nightly miri test -p tessera-rl-simd --test int_lanes --locked -- --skip random"
      - run: "cargo +nightly miri test -p tessera-rl-simd --test int_lanes --locked -- --skip random"
        env:
          # A step's RUSTFLAGS replaces the job's, so -D warnings is restated.
          RUSTFLAGS: -C target-feature=+sse4.2,+avx2 -D warnings
      # No public unsafe function in tessera-rl-pyffi, from rustdoc's JSON
      # (nightly only; #272 step 3). The source scan runs in the Python tests.
      - run: python3 scripts/check_pyffi_api.py
