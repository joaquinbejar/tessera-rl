# SPDX-License-Identifier: MIT OR Apache-2.0

# Nightly Miri run over the audited views and the canonical encoding
# (ADR-0024). Miri needs the nightly toolchain, so this workflow installs it
# explicitly and leaves rust-toolchain.toml untouched.

name: Miri

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miri:
    runs-on: [self-hosted, xaskar]
    env:
      # proptest's failure persistence calls getcwd, which Miri's isolation
      # rejects; turn it off and forward the switch into the interpreter.
      PROPTEST_DISABLE_FAILURE_PERSISTENCE: "1"
      MIRIFLAGS: -Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p tessera-rl-core --locked
      - run: "cargo +nightly miri test -p tessera-rl-engine --lib --locked -- buffer:: validate::"
      # The gang's job publication and trampoline (ADR-0047); FP control
      # asm and address waits are stubbed under cfg(miri), the protocol is not.
      - run: "cargo +nightly miri test -p tessera-rl-engine --lib --locked sys::gang::"
      # The Async id rings and token id buffers (ADR-0047): atomics only.
      - run: "cargo +nightly miri test -p tessera-rl-engine --lib --locked -- sys::ring:: sys::id_buffers::"
      # The Pipelined mode end to end (ADR-0047); the 64-worker comparison is
      # too slow under Miri and runs natively.
      - run: "cargo +nightly miri test -p tessera-rl-engine --test pipelined --locked -- --skip bit_for_bit"
      # The Async mode end to end (ADR-0047); the 64-worker comparison is too
      # slow under Miri and runs natively, and the forgotten-token test leaks
      # its allocation by design (`mem::forget`).
      - run: "cargo +nightly miri test -p tessera-rl-engine --test async_mode --locked -- --skip per_instance --skip forgotten"
      # DLPack export ownership (ADR-0003 rule 1), without an interpreter.
      - run: cargo +nightly miri test -p tessera-rl-py --lib --locked ffi::dlpack
