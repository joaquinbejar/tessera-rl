name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The toolchain comes from rust-toolchain.toml; rustup installs it on first use.

# Every job runs on the owner's self-hosted runners (one runner instance
# per host). Each self-hosted job is skipped for a pull request from a fork
# that leaves this workflow unchanged. That is not a protection on its own:
# a fork's pull request runs the workflow files of its own head, so it can
# edit this guard or add a workflow. The repository setting that requires
# approval before workflows run for all outside contributors is the control
# that must stay on; by default a fork's run is never approved, and a
# maintainer who has read the code pushes it to a branch of this repository
# for CI. No workflow uses pull_request_target or secrets.
jobs:
  # MEASUREMENT ONLY (throwaway branch): every job but gungraun removed.
  gungraun:
    # A job container on xaskar: the pinned image keeps the environment of
    # the baselines (benches/gungraun/environment.toml), which check
    # verifies; the runner removes the container after the job.
    runs-on: [self-hosted, xaskar]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    container:
      # The baseline's image, by digest (benches/gungraun/environment.toml).
      image: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
      options: --security-opt seccomp=unconfined
    env:
      TESSERA_GUNGRAUN_IMAGE: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y valgrind=1:3.24.0-3
      - run: cargo install --locked gungraun-runner --version 0.20.0
      - run: scripts/gungraun.sh check
      # The container runs as root: give the workspace back to the runner
      # user so the next checkout on the host can clean it.
      - if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"
