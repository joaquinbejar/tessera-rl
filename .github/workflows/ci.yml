name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The toolchain comes from rust-toolchain.toml; rustup installs it on first use.

jobs:
  fmt:
    runs-on: xaskar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is off: the Windows box is the owner's personal
        # machine, with no runner; the Windows checks run there natively,
        # in short announced sessions.
        os: [xaskar, m4-linux-arm64, m4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --all-features --locked
      # Release, without debug assertions: the FP boundary tests (ADR-0037)
      # only detect compiler motion in optimized builds.
      - run: cargo test -p tessera-rl-num --release --all-features --locked

  # The native wait on Windows (WaitOnAddress) runs only on request until
  # this job passes; it is the precondition for `Auto` to use it there.
  windows-native-wait:
    # Off: there is no Windows runner (see clippy-test).
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo test -p tessera-rl-engine --test sync --locked test_every_wait_backend_matches_inline -- --exact

  # The fuzz crate lives outside the workspace: check that it still builds
  # on stable (the targets themselves run nightly in fuzz.yml). It is not
  # under cargo deny: libfuzzer-sys compiles LLVM's C++ libFuzzer and is
  # outside the production dependency graph.
  fuzz-check:
    runs-on: xaskar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked

  musl:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xaskar
            target: x86_64-unknown-linux-musl
          - os: m4-linux-arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A dev-dependency builds C (criterion -> alloca); the production
      # graph has no C code (cargo deny, exclude-dev).
      # Self-hosted: xaskar has musl-tools installed (nothing is installed
      # on the shared host); the m4 Linux container runner, as root,
      # installs it into its own container when it is missing.
      - run: |
          if ! command -v musl-gcc >/dev/null; then
            if [ "$(id -u)" = 0 ]; then
              apt-get update && apt-get install -y musl-tools
            else
              echo "musl-gcc is missing on this runner" >&2
              exit 1
            fi
          fi
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo test --workspace --all-features --locked --target ${{ matrix.target }}

  math-diff:
    name: math differential (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [xaskar, m4-linux-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo run -p tessera-rl-math-oracle --release --locked -- diff ${{ github.run_id }} 1000000

  loom:
    runs-on: xaskar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test -p tessera-rl-engine --lib --release --locked -- gang storage
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"
          CARGO_TARGET_DIR: target/loom

  msrv:
    runs-on: xaskar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 check --workspace --all-targets --locked

  docs:
    runs-on: xaskar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  readme:
    runs-on: xaskar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-readme
      - run: make readme-check

  deny:
    runs-on: xaskar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The Python tests, including the PyTorch consumer tests (marker `torch`,
  # ADR-0003 rule 7). uv is pinned; it fetches CPython 3.11 itself.
  python:
    runs-on: xaskar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: pipx install uv==0.13.6
      - run: make py-test-torch

  # Instruction-count gate (ADR-0025 level 1): gungraun against the
  # committed baseline, in the baseline's image (benches/gungraun/README.md).
  gungraun:
    # A job container on xaskar: the pinned image keeps the environment of
    # the baselines (benches/gungraun/environment.toml), which check
    # verifies; the runner removes the container after the job.
    runs-on: xaskar
    container:
      # The baseline's image, by digest (benches/gungraun/environment.toml).
      image: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
      options: --security-opt seccomp=unconfined
    env:
      TESSERA_GUNGRAUN_IMAGE: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y valgrind=1:3.24.0-3
      - run: cargo install --locked gungraun-runner --version 0.20.0
      - run: scripts/gungraun.sh check
      # The container runs as root: give the workspace back to the runner
      # user so the next checkout on the host can clean it.
      - if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"
