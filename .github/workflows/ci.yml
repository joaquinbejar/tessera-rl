name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The toolchain comes from rust-toolchain.toml; rustup installs it on first use.

# Every job runs on the owner's self-hosted runners (one runner instance
# per host). Each self-hosted job is skipped for a pull request from a fork
# that leaves this workflow unchanged. That is not a protection on its own:
# a fork's pull request runs the workflow files of its own head, so it can
# edit this guard or add a workflow. The repository setting that requires
# approval before workflows run for all outside contributors is the control
# that must stay on; by default a fork's run is never approved, and a
# maintainer who has read the code pushes it to a branch of this repository
# for CI. No workflow uses pull_request_target or secrets.
#
# Linux x86-64 jobs that need only the Rust toolchains run on any host with
# the linux-x64 label (xaskar or flumix) and print the host and CPU first.
# Pinned to xaskar: gungraun (its baselines belong to that CPU and image),
# musl (musl-gcc is installed there only), readme (install-action needs jq),
# deny (a Docker action), python and pufferlib (pipx), and the matrix jobs
# "clippy and test (xaskar)" and "math differential (xaskar)", whose names
# are merge conditions.
jobs:
  fmt:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy and test (${{ matrix.os }})
    runs-on: [self-hosted, "${{ matrix.os }}"]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is off: the Windows box is the owner's personal
        # machine, with no runner; the Windows checks run there natively,
        # in short announced sessions.
        os: [xaskar, m4-linux-arm64, m4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: python3 scripts/check_simd_disasm.py
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --locked
      # The downstream consumer alone: no workspace feature unification can
      # supply what the facade does not forward.
      - run: cargo test -p tessera-rl-downstream-test --locked
      # The facade's own feature, alone: debug-checks must reach the engine
      # through the facade, not through workspace feature unification.
      - run: cargo test -p tessera-rl --features debug-checks --locked
      - run: cargo test --workspace --release --all-features --locked
      # Release, without debug assertions: the FP boundary tests (ADR-0037)
      # only detect compiler motion in optimized builds.
      - run: cargo test -p tessera-rl-num --release --all-features --locked

  # The native wait on Windows (WaitOnAddress) runs only on request until
  # this job passes; it is the precondition for `Auto` to use it there.
  windows-native-wait:
    # Off: there is no Windows runner (see clippy-test).
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo test -p tessera-rl-engine --test sync --locked test_every_wait_backend_matches_inline -- --exact

  # The fuzz crate lives outside the workspace: check that it still builds
  # on stable (the targets themselves run nightly in fuzz.yml). It is not
  # under cargo deny: libfuzzer-sys compiles LLVM's C++ libFuzzer and is
  # outside the production dependency graph.
  fuzz-check:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked

  musl:
    name: test (${{ matrix.target }})
    runs-on: [self-hosted, "${{ matrix.os }}"]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xaskar
            target: x86_64-unknown-linux-musl
          - os: m4-linux-arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A dev-dependency builds C (criterion -> alloca); the production
      # graph has no C code (cargo deny, exclude-dev).
      # Self-hosted: xaskar has musl-tools installed (nothing is installed
      # on the shared host); the m4 Linux container runner, as root,
      # installs it into its own container when it is missing.
      - run: |
          if ! command -v musl-gcc >/dev/null; then
            if [ "$(id -u)" = 0 ]; then
              apt-get update && apt-get install -y musl-tools
            else
              echo "musl-gcc is missing on this runner" >&2
              exit 1
            fi
          fi
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo test --workspace --all-features --locked --target ${{ matrix.target }}

  math-diff:
    name: math differential (${{ matrix.os }})
    runs-on: [self-hosted, "${{ matrix.os }}"]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [xaskar, m4-linux-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo run -p tessera-rl-math-oracle --release --locked -- diff ${{ github.run_id }} 1000000

  build-id:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A changed TESSERA_BUILD_ID rebuilds the engine and reaches it (ADR-0011).
      - run: scripts/check_build_id.sh

  loom:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test -p tessera-rl-engine --lib --release --locked -- gang storage ring id_buffers live_model waiter
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"
          CARGO_TARGET_DIR: target/loom

  msrv:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 check --workspace --all-targets --locked

  docs:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  readme:
    runs-on: [self-hosted, xaskar]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-readme
      - run: make readme-check

  deny:
    runs-on: [self-hosted, xaskar]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The Python tests, including the PyTorch consumer tests (marker `torch`,
  # ADR-0003 rule 7). uv is pinned; it fetches CPython 3.11 itself.
  python:
    runs-on: [self-hosted, xaskar]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: pipx install uv==0.13.6
      # Self-hosted: checkout's git clean deletes the extension module that
      # the editable build put in python/tessera_rl, and uv's persistent
      # cache installs the project again without rebuilding it. Build it
      # explicitly, and check that the extension imports.
      - run: uv sync --locked --python 3.11 --group test --group torch --reinstall-package tessera-rl
      - run: uv run --locked --python 3.11 --group test --group torch python -c "import tessera_rl._native"
      # The hooks wheel first: the target reinstalls the default wheel even on a
      # failure, and the next step proves no hook leaked into later tests.
      - run: make py-test-hooks
      - run: uv run --locked --python 3.11 python -c "import tessera_rl._native as n; assert not hasattr(n, '_make_panic_counter')"
      - run: make py-test-torch
      # The tool that anchors wheels to the golden fixtures (wheels.yml runs it).
      - run: make py-test-wheels
      # The JAX handles (marker `jax`, SPEC 15.2) at the pinned jax and jaxlib.
      - run: make py-test-jax

  # The PufferLib adapter at its own pins (compat/pufferlib). x86-64: PufferLib
  # 3.0.0 does not build on linux-arm64. Timeouts kill the process group.
  pufferlib:
    runs-on: [self-hosted, xaskar]
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: pipx install uv==0.13.6
      - run: make puffer-test

  # Instruction-count gate (ADR-0025 level 1): gungraun against the
  # committed baseline, in the baseline's image (benches/gungraun/README.md).
  gungraun:
    # A job container on xaskar: the pinned image keeps the environment of
    # the baselines (benches/gungraun/environment.toml), which check
    # verifies; the runner removes the container after the job.
    runs-on: [self-hosted, xaskar]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    container:
      # The baseline's image, by digest (benches/gungraun/environment.toml).
      image: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
      options: --security-opt seccomp=unconfined
    env:
      TESSERA_GUNGRAUN_IMAGE: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y valgrind=1:3.24.0-3
      - run: cargo install --locked gungraun-runner --version 0.20.0
      - run: scripts/gungraun.sh check
      # The container runs as root: give the workspace back to the runner
      # user so the next checkout on the host can clean it.
      - if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"
