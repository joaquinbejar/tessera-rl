# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The GitHub-hosted Windows jobs (#358) also run on request, for example on
  # a release's frozen SHA. The self-hosted jobs' guard skips them on this
  # event.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The toolchain comes from rust-toolchain.toml; rustup installs it on first use.

# Every job runs on the owner's self-hosted runners (one runner instance
# per host), except the two Windows jobs (#358), which are GitHub-hosted and
# run only on pushes to main and on workflow_dispatch.
# Each self-hosted job is skipped for a pull request from a fork
# that leaves this workflow unchanged. That is not a protection on its own:
# a fork's pull request runs the workflow files of its own head, so it can
# edit this guard or add a workflow. The repository setting that requires
# approval before workflows run for all outside contributors is the control
# that must stay on; by default a fork's run is never approved, and a
# maintainer who has read the code pushes it to a branch of this repository
# for CI. No workflow uses pull_request_target or secrets.
#
# Linux x86-64 jobs that need no Docker and no host-specific state run on
# any host with the linux-x64 label (xaskar or flumix) and print the host
# and CPU first. Pinned to xaskar: gungraun (its baselines belong to that
# CPU and image), musl (musl-gcc is installed there only), deny (a Docker
# action), and the matrix jobs "clippy and test (xaskar)" and "math
# differential (xaskar)", whose names are merge conditions.
jobs:
  fmt:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy and test (${{ matrix.os }})
    runs-on: [self-hosted, "${{ matrix.os }}"]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        # No Windows leg here: Windows runs GitHub-hosted (#358), in the
        # windows-python and windows-native-wait jobs below, never on the
        # owner's Windows box.
        os: [xaskar, m4-linux-arm64, m4]
        # Where the real ONNX Runtime may be loaded (owner's decision,
        # 2026-11-12; scripts/onnx_test.sh): only in a no-network container
        # on xaskar; natively on the M4's Linux VM only if it has no Docker;
        # natively on macOS.
        include:
          - os: xaskar
            onnx_native: forbid
          - os: m4-linux-arm64
            onnx_native: if-no-docker
          - os: m4
            onnx_native: always
    env:
      # No test loads ONNX Runtime with telemetry enabled (ADR-0057).
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: python3 scripts/check_simd_disasm.py
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --locked
      # tests/host-glue enables the engine's host feature, so workspace
      # feature unification builds the engine with it in every run above.
      - name: Engine alone, default features, clippy (no host)
        run: cargo clippy -p tessera-rl-engine --all-targets --locked -- -D warnings
      - name: Engine alone, default features (the shipped configuration, no host)
        run: cargo test -p tessera-rl-engine --locked
      # tests/host-wheel enables tessera-rl-pyffi's host feature, so workspace
      # feature unification builds pyffi with it in every run above.
      - name: pyffi alone, default features (no host)
        run: cargo test -p tessera-rl-pyffi --features pyo3/extension-module --locked
      # The downstream consumer alone: no workspace feature unification can
      # supply what the facade does not forward.
      - run: cargo test -p tessera-rl-downstream-test --locked
      # The facade's own feature, alone: debug-checks must reach the engine
      # through the facade, not through workspace feature unification.
      - run: cargo test -p tessera-rl --features debug-checks --locked
      - run: cargo test --workspace --release --all-features --locked
      # Release, without debug assertions: the FP boundary tests (ADR-0037)
      # only detect compiler motion in optimized builds.
      - run: cargo test -p tessera-rl-num --release --all-features --locked
      # The audited ONNX Runtime version read against the real library
      # (ADR-0057 section 4; owner's choice of 2026-11-12). The pinned wheel
      # is fetched by its sha256 into RUNNER_TEMP with the standard library
      # only; nothing is installed. Where it may load is set per leg by
      # matrix.onnx_native (scripts/onnx_test.sh): xaskar `forbid`, only in
      # an ephemeral no-network container with the pinned image already
      # present, else exit 1; m4-linux-arm64 `if-no-docker`, that container
      # if Docker is present (image absent: exit 1), natively only when there
      # is no docker binary; m4 `always`, natively. Natively means telemetry
      # off and a scratch HOME.
      - run: python3 scripts/fetch_onnxruntime.py "$RUNNER_TEMP/onnxruntime" > "$RUNNER_TEMP/onnxruntime.path"
      - run: scripts/onnx_test.sh "$(cat "$RUNNER_TEMP/onnxruntime.path")" "$ONNX_TEST_IMAGE"
        env:
          ONNX_TEST_IMAGE: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
          ONNX_TEST_NATIVE: ${{ matrix.onnx_native }}

  # The Python suite on Windows (#358): GitHub-hosted windows-2025, the exact
  # wheel_job.sh call of wheels.yml's Windows leg (#350, same pinned rustup-init
  # and uv installer hashes), which builds the release wheel without the onnx feature
  # and runs tests/python against it. Hard from its first run (REVIEW #358
  # design r1); POSIX-only tests skip themselves on Windows.
  windows-python:
    name: Python suite (x86_64-pc-windows-msvc)
    runs-on: windows-2025
    # GitHub-hosted, 120 or 45 hosted minutes: only pushes to main (which a
    # release's frozen SHA is) and workflow_dispatch, never per pull request
    # (team-lead's decision for #358), and only in this repository.
    if: github.repository == 'joaquinbejar/tessera-rl' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash, so that wheel_job.sh runs as on the other legs.
        shell: bash
    env:
      WHEEL_RUN: ${{ github.workspace }}/.wheel-run
      # x86-64 implements trapped FP exceptions (fp_child.py uses
      # _controlfp_s on Windows): the unmasked FP boundary test must check
      # the enables, never skip (#225).
      TESSERA_EXPECT_FP_TRAPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup-init.exe 1.29.3 and uv 0.13.6 (uv-x86_64-pc-windows-msvc.zip),
      # by their published sha256; the toolchain is rust-toolchain's.
      - run: scripts/wheel_job.sh x86_64-pc-windows-msvc "" 38027d51d69a5d05493627a0634dbea52d6cd793c8f072d2373d3f4163eec7db a2a8820d5eea32f08ef467ef3b7f66883a9b076d5737a2fc2fbb5f458d1bb50f release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          if-no-files-found: warn
          name: windows-python-reports
          path: |
            golden-report.json
            checks.json
            determinism.json

  # The native wait on Windows (WaitOnAddress, #358): GitHub-hosted
  # windows-2025. Until this job has passed, `Auto` does not use it there;
  # switching `Auto` is a follow-up issue.
  windows-native-wait:
    name: native wait (x86_64-pc-windows-msvc)
    runs-on: windows-2025
    # GitHub-hosted, 120 or 45 hosted minutes: only pushes to main (which a
    # release's frozen SHA is) and workflow_dispatch, never per pull request
    # (team-lead's decision for #358), and only in this repository.
    if: github.repository == 'joaquinbejar/tessera-rl' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-run/rustup
      CARGO_HOME: ${{ github.workspace }}/.rustup-run/cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same verified rustup-init as the wheel legs (scripts/install_rustup.sh),
      # not the hosted image's rustup.
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - run: scripts/install_rustup.sh x86_64-pc-windows-msvc 38027d51d69a5d05493627a0634dbea52d6cd793c8f072d2373d3f4163eec7db "$RUNNER_TEMP/rustup-init"
      - run: cargo test -p tessera-rl-engine --test sync --locked test_every_wait_backend_matches_inline -- --exact

  # The fuzz crate lives outside the workspace: check that it still builds
  # on stable (the targets themselves run nightly in fuzz.yml). It is not
  # under cargo deny: libfuzzer-sys compiles LLVM's C++ libFuzzer and is
  # outside the production dependency graph.
  fuzz-check:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked

  musl:
    name: test (${{ matrix.target }})
    runs-on: [self-hosted, "${{ matrix.os }}"]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xaskar
            target: x86_64-unknown-linux-musl
          - os: m4-linux-arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A dev-dependency builds C (criterion -> alloca); the production
      # graph has no C code (cargo deny, exclude-dev).
      # Self-hosted: xaskar has musl-tools installed (nothing is installed
      # on the shared host); the m4 Linux container runner, as root,
      # installs it into its own container when it is missing.
      - run: |
          if ! command -v musl-gcc >/dev/null; then
            if [ "$(id -u)" = 0 ]; then
              apt-get update && apt-get install -y musl-tools
            else
              echo "musl-gcc is missing on this runner" >&2
              exit 1
            fi
          fi
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo test --workspace --all-features --locked --target ${{ matrix.target }}

  math-diff:
    name: math differential (${{ matrix.os }})
    runs-on: [self-hosted, "${{ matrix.os }}"]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [xaskar, m4-linux-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      - run: cargo run -p tessera-rl-math-oracle --release --locked -- diff ${{ github.run_id }} 1000000

  build-id:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A changed TESSERA_BUILD_ID rebuilds the engine and reaches it (ADR-0011).
      - run: scripts/check_build_id.sh

  loom:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test -p tessera-rl-engine --lib --release --locked -- gang storage ring id_buffers live_model waiter watch_slot
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"
          CARGO_TARGET_DIR: target/loom

  msrv:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 check --workspace --all-targets --locked
      # The ONNX crate with its optional feature (ort declares 1.92).
      - run: cargo +1.95.0 check -p tessera-rl-onnx --features onnx --all-targets --locked

  facade-features:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SPEC 20.1 facade features (#350): none, each alone, and all.
      - run: cargo check -p tessera-rl --no-default-features --all-targets --locked
      - run: cargo check -p tessera-rl --no-default-features --features search --all-targets --locked
      - run: cargo check -p tessera-rl --no-default-features --features simd --all-targets --locked
      - run: cargo check -p tessera-rl --no-default-features --features onnx --all-targets --locked
      - run: cargo check -p tessera-rl --all-features --all-targets --locked

  docs:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  readme:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-readme
      - run: make readme-check

  # The Burn integration (#367): its own workspace and lock, outside the
  # root workspace and every other job. fmt, clippy, tests, cargo deny and
  # the PPO example's smoke run (make burn-check). Its steps run only when
  # the integration, a crate it builds, its policy or this workflow changed
  # (scripts/paths_changed.sh); the job itself always runs, so it is never
  # missing from a check list.
  burn-check:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        # bash: pipefail, so a failing script fails the step through the tee.
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: >-
          scripts/paths_changed.sh "$BASE" "$GITHUB_SHA"
          integrations/burn/ crates/tessera-rl-core/ crates/tessera-rl-engine/
          crates/tessera-rl-classic/ crates/tessera-rl-num/ crates/tessera-rl-simd/
          crates/tessera-rl-macros/ .github/workflows/ci.yml Makefile
          Cargo.toml rust-toolchain.toml clippy.toml scripts/paths_changed.sh
          | tee -a "$GITHUB_OUTPUT"
      - if: steps.paths.outputs.changed == 'true'
        run: cargo fmt --manifest-path integrations/burn/Cargo.toml --all -- --check
      - if: steps.paths.outputs.changed == 'true'
        run: cargo clippy --manifest-path integrations/burn/Cargo.toml --all-targets --locked -- -D warnings
      - if: steps.paths.outputs.changed == 'true'
        run: cargo test --manifest-path integrations/burn/Cargo.toml --locked
      - if: steps.paths.outputs.changed == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: integrations/burn/Cargo.toml
          command: check
          arguments: --config integrations/burn/deny.toml
          command-arguments: licenses bans
      - if: steps.paths.outputs.changed == 'true'
        run: cargo run --manifest-path integrations/burn/Cargo.toml --release --locked -p ppo-cartpole -- --smoke
      # The example sanity gate on 3 seeds (about 5 s CPU each; not a SPEC 18
      # learning test).
      - if: steps.paths.outputs.changed == 'true'
        run: make burn-gate

  deny:
    runs-on: [self-hosted, xaskar]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The Python tests, including the PyTorch consumer tests (marker `torch`,
  # ADR-0003 rule 7). uv is pinned; it fetches CPython 3.11 itself.
  python:
    runs-on: [self-hosted, linux-x64]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # x86-64 always implements trapped FP exceptions: the unmasked FP
      # boundary test must check the trap enables here, never skip (#225).
      TESSERA_EXPECT_FP_TRAPS: "1"
      # The gungraun-bless run blocks are checked under dash here; a missing
      # dash fails instead of skipping (tests/python/test_gungraun_bless_workflow.py).
      TESSERA_REQUIRE_DASH: "1"
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      # uv 0.13.6 is installed on the runner by pipx; nothing is installed
      # here. The runner service's PATH may lack pipx's bin directory: put
      # that directory on the PATH of the later steps, only if the uv in it
      # is exactly the pinned 0.13.6 (fail closed otherwise).
      - run: |
          d=$(pipx environment --value PIPX_BIN_DIR)
          v=$("$d/uv" --version) || { echo "no runnable uv in pipx's bin directory $d" >&2; exit 1; }
          case "$v" in "uv 0.13.6" | "uv 0.13.6 "*) ;; *) echo "uv in $d is '$v', not the pinned uv 0.13.6" >&2; exit 1 ;; esac
          echo "$d" >> "$GITHUB_PATH"
      - run: command -v uv >/dev/null || { echo "uv not on PATH" >&2; exit 1; }
      # Self-hosted: checkout's git clean deletes the extension module that
      # the editable build put in python/tessera_rl, and uv's persistent
      # cache installs the project again without rebuilding it. Build it
      # explicitly, and check that the extension imports.
      - run: uv sync --locked --python 3.11 --group test --group torch --reinstall-package tessera-rl
      - run: uv run --locked --python 3.11 --group test --group torch python -c "import tessera_rl._native"
      # The hooks wheel first: the target reinstalls the default wheel even on a
      # failure, and the next step proves no hook leaked into later tests.
      - run: make py-test-hooks
      - run: uv run --locked --python 3.11 python -c "import tessera_rl._native as n; assert not hasattr(n, '_make_panic_counter')"
      - run: make py-test-torch
      # The tool that anchors wheels to the golden fixtures (wheels.yml runs it).
      - run: make py-test-wheels
      # The JAX handles (marker `jax`, SPEC 15.2) at the pinned jax and jaxlib.
      - run: make py-test-jax
      # The .pyi stubs (issue #348): mypy --strict, and stubtest against the
      # installed package.
      - run: make py-typecheck
      # Host protocol 1 (#272 step 4): builds the test host wheel of
      # tests/host-wheel and runs its tests (the factory, the two config
      # front ends, the exception classes).
      - name: Host protocol 1 test wheel (make py-test-host)
        run: make py-test-host
      # The out-of-tree example wheel (#272 step 6): built next to the
      # first-party wheel, through tessera_rl.make, Gymnasium and PettingZoo,
      # the ownership and FP boundary checks, and determinism across runs.
      - name: Host example wheel (make py-test-orderbook)
        run: make py-test-orderbook
      # cargo tessera end to end (#351): scaffold a host environment crate,
      # then check --python (bless, then compare) and bench --quick in it,
      # every cargo call --locked --offline against a lock derived from
      # Cargo.lock. The log prints each phase's wall time.
      - name: cargo tessera end to end (make cargo-tessera-e2e)
        run: make cargo-tessera-e2e

  # The Python ONNX evaluator (ADR-0057) with the extension's `onnx` feature,
  # against the library fetched by its sha256 (scripts/fetch_onnxruntime.py;
  # no onnxruntime package, so the tests that need it skip). On xaskar, as
  # the owner chose for the Rust leg: the tests that load the library run in
  # an ephemeral container with no network, and nothing else loads it. A
  # macOS leg can come later (the M4 is reserved).
  python-onnx:
    runs-on: [self-hosted, xaskar]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # No test loads ONNX Runtime with telemetry enabled (ADR-0057).
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      # uv 0.13.6 is installed on the runner by pipx; nothing is installed
      # here. The runner service's PATH may lack pipx's bin directory: put
      # that directory on the PATH of the later steps, only if the uv in it
      # is exactly the pinned 0.13.6 (fail closed otherwise).
      - run: |
          d=$(pipx environment --value PIPX_BIN_DIR)
          v=$("$d/uv" --version) || { echo "no runnable uv in pipx's bin directory $d" >&2; exit 1; }
          case "$v" in "uv 0.13.6" | "uv 0.13.6 "*) ;; *) echo "uv in $d is '$v', not the pinned uv 0.13.6" >&2; exit 1 ;; esac
          echo "$d" >> "$GITHUB_PATH"
      - run: command -v uv >/dev/null || { echo "uv not on PATH" >&2; exit 1; }
      - run: python3 scripts/fetch_onnxruntime.py "$RUNNER_TEMP/onnxruntime" > "$RUNNER_TEMP/onnxruntime.path"
      # The extension with the onnx feature, without the [onnx] extra.
      - run: MATURIN_PEP517_ARGS="--features onnx" uv sync --locked --python 3.11 --group test --reinstall-package tessera-rl
      - run: scripts/py_onnx_test.sh "$(cat "$RUNNER_TEMP/onnxruntime.path")" "$ONNX_TEST_IMAGE"
        env:
          ONNX_TEST_IMAGE: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
      # The next job on this host gets the default build back.
      - if: always()
        run: uv sync --locked --python 3.11 --group test --reinstall-package tessera-rl

  # The PufferLib adapter at its own pins (compat/pufferlib). x86-64: PufferLib
  # 3.0.0 does not build on linux-arm64. Timeouts kill the process group.
  pufferlib:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Two hosts carry linux-x64: the log names the one that ran this job.
      - run: hostname && grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Self-hosted runners: the post step would delete rustup from ~/.cargo/bin.
          cache-bin: "false"
      # uv 0.13.6 is installed on the runner by pipx; nothing is installed
      # here. The runner service's PATH may lack pipx's bin directory: put
      # that directory on the PATH of the later steps, only if the uv in it
      # is exactly the pinned 0.13.6 (fail closed otherwise).
      - run: |
          d=$(pipx environment --value PIPX_BIN_DIR)
          v=$("$d/uv" --version) || { echo "no runnable uv in pipx's bin directory $d" >&2; exit 1; }
          case "$v" in "uv 0.13.6" | "uv 0.13.6 "*) ;; *) echo "uv in $d is '$v', not the pinned uv 0.13.6" >&2; exit 1 ;; esac
          echo "$d" >> "$GITHUB_PATH"
      - run: command -v uv >/dev/null || { echo "uv not on PATH" >&2; exit 1; }
      - run: make puffer-test

  # Instruction-count gate (ADR-0025 level 1): gungraun against the
  # committed baseline, in the baseline's image (benches/gungraun/README.md).
  gungraun:
    # A job container on xaskar: the pinned image keeps the environment of
    # the baselines (benches/gungraun/environment.toml), which check
    # verifies; the runner removes the container after the job.
    runs-on: [self-hosted, xaskar]
    # Skipped for an unmodified fork pull request (see the header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    container:
      # The baseline's image, by digest (benches/gungraun/environment.toml).
      image: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
      options: --security-opt seccomp=unconfined
    env:
      TESSERA_GUNGRAUN_IMAGE: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Valgrind from a fixed Debian snapshot, glibc checked (scripts/gungraun_apt.sh).
      - run: scripts/gungraun_apt.sh
      - run: cargo install --locked gungraun-runner --version 0.20.0
      - run: scripts/gungraun.sh check
      # The container runs as root: give the workspace back to the runner
      # user so the next checkout on the host can clean it.
      - if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"
