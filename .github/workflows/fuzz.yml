# Nightly fuzzing (ADR-0024 layer 5): the validation boundary, configs,
# persisted records and the canonical decoder. cargo-fuzz needs nightly, so
# this workflow installs it explicitly and leaves rust-toolchain.toml
# untouched. Crashes are uploaded as artifacts.

name: Fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: xaskar
    strategy:
      fail-fast: false
      matrix:
        target: [actions, config, record, decode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      # A writable corpus first, then the target's committed regressions
      # (fuzz/regressions/<target>/) as seeds.
      - run: mkdir -p corpus/${{ matrix.target }} regressions/${{ matrix.target }}
        working-directory: fuzz
      - run: cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} regressions/${{ matrix.target }} -- -max_total_time=300
        working-directory: fuzz
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
