# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Builds the W0 wheels (default release profile) and anchors each one to the
# committed golden fixtures (docs/reviews/pgo-wheels-design.md, section 7).
#
# Manual only: a run occupies shared self-hosted runners and needs the
# coordinator's go-ahead for each host use. No LTO, no PGO and no publishing.
name: wheels

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels
  cancel-in-progress: false

env:
  MATURIN_VERSION: "1.16.0"
  # The SPEC 7.1 support floor; ignored on Linux.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  wheel:
    name: W0 (${{ matrix.target }})
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: xaskar
            target: x86_64-unknown-linux-gnu
            compatibility: manylinux_2_28
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
          - runner: m4-linux-arm64
            target: aarch64-unknown-linux-gnu
            compatibility: manylinux_2_28
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
          - runner: m4
            target: aarch64-apple-darwin
            compatibility: ""
            image: ""
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain pins the version)
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: uv
        run: curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: >-
          uvx --python 3.11 "maturin==$MATURIN_VERSION" build --release --locked
          --target "${{ matrix.target }}"
          ${{ matrix.compatibility && format('--compatibility {0}', matrix.compatibility) || '' }}
          --out dist
      - name: Action files from the Rust golden tests
        run: TESSERA_GOLDEN_ACTIONS="$PWD/golden-actions" cargo test --release --locked -p tessera-rl-classic -p tessera-rl-games --test golden
      - name: Anchor the built wheel to the fixtures
        # From a directory of its own, so that the installed wheel is imported
        # and not python/tessera_rl.
        run: |
          uv venv --python 3.11 anchor-venv
          uv pip install --python anchor-venv/bin/python dist/*.whl numpy==2.4.6 xxhash==4.0.2
          mkdir anchor-run
          cd anchor-run
          ../anchor-venv/bin/python -I ../tools/wheel_golden.py --actions ../golden-actions --out ../golden-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: |
            dist/*.whl
            golden-report.json
