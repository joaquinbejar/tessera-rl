# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Builds the W0 wheels (default release profile), anchors each installed wheel
# to the whole committed golden fixtures and runs the Python suite against it
# (docs/reviews/pgo-wheels-design.md, section 7). No LTO, no PGO, no publishing.
#
# aarch64 Linux runs on a GitHub-hosted arm64 runner (issue #149, owner decision
# of 2026-11-11): the self-hosted m4-linux-arm64 runner is itself a container
# with no Docker socket, so a job container cannot start there (run 42618212792).
# It is the only hosted job; it builds in the pinned manylinux_2_28_aarch64 image
# with the same script as x86_64.
#
# Manual only, and each dispatch names the coordinator's approval of a window:
# these runners are shared. The first dispatch is also the first test of this
# workflow and must be announced as such.
name: wheels

on:
  workflow_dispatch:
    inputs:
      approved_window:
        description: The coordinator's approval of this host window
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: wheels
  cancel-in-progress: false

jobs:
  preflight:
    # `concurrency` serializes only this workflow, so other tessera CI is checked.
    # It is a check at start, not a lock: the scheduled window is what prevents
    # an overlap with work that starts later.
    runs-on: [self-hosted, m4]
    timeout-minutes: 5
    steps:
      - name: Refuse while other runs of this repository are active
        env:
          TOKEN: ${{ github.token }}
          WINDOW: ${{ inputs.approved_window }}
        run: |
          echo "approved window: $WINDOW"
          # Run 42064531284 (CI, feat/pipelined, PR #82, merged) has been reported
          # queued since 2026-11-05, and GitHub refuses to cancel or delete it. The
          # owner approved this one exception on 2026-11-09, by id and only while
          # that run is reported queued. Nothing else is ignored.
          for status in in_progress queued; do
            curl -fsSL -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=$status&per_page=100" \
              | python3 -c 'import json,os,sys; me=int(os.environ["GITHUB_RUN_ID"]); o=[r["name"] for r in json.load(sys.stdin)["workflow_runs"] if r["id"]!=me and not (r["id"]==42064531284 and r["status"]=="queued")]; print(o); sys.exit(1 if o else 0)'
          done

  linux:
    needs: preflight
    name: W0 (${{ matrix.target }})
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: xaskar
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
            # --init: PID 1 must reap orphans, or the suite's process tests see
            # zombies as alive (hypothesis from run 42618212792, tested by the next run).
            # --user: the runner's user, so nothing in the workspace ends up root's.
            limits: --cpuset-cpus=12-15 --init --user 1000:1000
            rustup_sha: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
            uv_sha: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
            # x86-64 implements trapped FP exceptions: the unmasked FP
            # boundary test must check the trap enables, never skip (#225).
            expect_fp_traps: "1"
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.limits }}
    defaults:
      run:
        shell: bash
    env:
      WHEEL_RUN: ${{ github.workspace }}/.wheel-run
      TESSERA_EXPECT_FP_TRAPS: ${{ matrix.expect_fp_traps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/wheel_job.sh "${{ matrix.target }}" manylinux_2_28 "${{ matrix.rustup_sha }}" "${{ matrix.uv_sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          if-no-files-found: warn
          name: wheel-${{ matrix.target }}
          path: |
            dist/*.whl
            golden-report.json
            checks.json
            determinism.json
      # The workspace is bind-mounted, so the container's end does not clean it.
      - if: always()
        run: rm -rf "$WHEEL_RUN" dist golden-report.json checks.json determinism.json

  linux-aarch64:
    # GitHub-hosted (free for public repositories): no owner machine is involved.
    # The workflow is workflow_dispatch only, and this guard keeps the job off any
    # other event and off forks even if the triggers ever grow.
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && github.repository == 'joaquinbejar/tessera-rl'
    name: W0 (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      # Tag 2026.11.07-1, the same tag as the x86_64 image above.
      image: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
      # --init as on x86_64: the suite's process tests need PID 1 to reap orphans.
      # No --user: the hosted runner's uid is not 1000 and its VM is discarded
      # after the job, so root-owned files leave nothing behind. No --cpuset-cpus:
      # the runner is not shared.
      options: --init
    defaults:
      run:
        shell: bash
    env:
      WHEEL_RUN: ${{ github.workspace }}/.wheel-run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/wheel_job.sh aarch64-unknown-linux-gnu manylinux_2_28 9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282 229e194255c7958d86d56e8790d969a6f74736592133f0dfd0076f754c642c1d
      # The suite above already imports the wheel in this image; this states it
      # on its own line, with the glibc symbol versions the wheel needs.
      - name: Smoke import in the manylinux_2_28 image
        run: |
          auditwheel show dist/*.whl
          "$WHEEL_RUN/venv/bin/python" -I -c 'import tessera_rl, platform; print(platform.machine(), platform.libc_ver(), tessera_rl._native.build_profile())'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          if-no-files-found: warn
          name: wheel-aarch64-unknown-linux-gnu
          path: |
            dist/*.whl
            golden-report.json
            checks.json
            determinism.json

  macos:
    needs: linux
    name: W0 (aarch64-apple-darwin)
    runs-on: [self-hosted, m4]
    timeout-minutes: 90
    env:
      WHEEL_RUN: ${{ github.workspace }}/.wheel-run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/wheel_job.sh aarch64-apple-darwin "" 63752a1919a3a4793173ec70f8f212621a7ce38ba6a246095984482f4de20f9f 60fbd5c8a1ed681845eea28d9d622fcde03c51e91a43465b64a1e17db1ed3472
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          if-no-files-found: warn
          name: wheel-aarch64-apple-darwin
          path: |
            dist/*.whl
            golden-report.json
            checks.json
            determinism.json
      - if: always()
        run: rm -rf "$WHEEL_RUN" dist golden-report.json checks.json determinism.json
